# Sleight of Mouth: Dilts' fourteen patterns, the beliefs they're demoed on,
# and what part of the belief each pattern aims at.
# Used by: _includes/sleight-of-mouth-explorer.html
#
# The "aims" grouping is a simplification, loosely after where Dilts places each
# pattern in his 1987 diagram (cause side, effect side, the whole belief).
# Every belief has the same shape: evidence -> link -> conclusion, and carries
# one reframe per pattern, keyed by the pattern's id. Beliefs are grouped in the
# picker by theme, in the order they appear here. Reframes are written in the
# believer's voice; the people and details in them are illustrative.

aims:
  - id: evidence
    name: The evidence
    blurb: Is the first half really what you think it is?
  - id: link
    name: The link
    blurb: Does the evidence actually lead there?
  - id: conclusion
    name: The conclusion
    blurb: Is that even the outcome that matters?
  - id: belief
    name: The belief itself
    blurb: Step outside and look at the belief as a thing.

patterns:
  - n: 1
    id: intention
    name: Intention
    aim: belief
    question: What is the positive purpose of this belief?
    explain:
      - Every belief, even a painful one, is trying to do something for you, like keep you safe, spare you disappointment, or push you to improve. Intention speaks to that purpose instead of arguing with the words.
      - Dilts builds on the NLP idea that behind every behavior is a positive intention. Once you name the purpose, you can keep it and look for a better way to serve it. You stop fighting the belief and start working with it.
  - n: 2
    id: redefining
    name: Redefining
    aim: evidence
    question: What's another way to say this, with slightly different words?
    explain:
      - Beliefs are made of words, and words carry baggage. Redefining swaps one key word for another that describes the same facts but implies something different, so "failure" becomes "feedback" and "ignored" becomes "busy."
      - The facts stay put; only the label moves, and the label is often what does the damage. A good redefinition stays honest. If the new word doesn't fit the facts, it's spin, and the old belief snaps back.
  - n: 3
    id: consequence
    name: Consequence
    aim: belief
    question: Where does holding this belief lead?
    explain:
      - Set aside whether the belief is true and look at what it does. If you keep acting on it, where does it take you?
      - Limiting beliefs often cause the outcome they predict, because believing you'll fail is a good way to stop trying. Pointing at that effect can loosen a belief faster than any argument about the evidence.
  - n: 4
    id: chunk_down
    name: Chunk down
    aim: evidence
    question: Get more specific. Which part, when, how much?
    explain:
      - Limiting beliefs live at a high level, in words like "always," "never" and "everyone." Chunking down breaks an element of the belief into smaller, specific pieces. Which part, on which day, who exactly?
      - Up close, the generalization often comes apart. "Forever" turns into particular days, and "everyone" turns into two people. Specific problems are ones you can act on.
  - n: 5
    id: chunk_up
    name: Chunk up
    aim: link
    question: What bigger class does this belong to?
    explain:
      - Chunking up goes the other way. It places an element of the belief inside a bigger category, so a personal failing becomes one case of something common or systemic.
      - Seen as part of a larger pattern, the link stops pointing at you in particular. The question changes from "what's wrong with me?" to "how does this kind of thing usually work?"
  - n: 6
    id: analogy
    name: Analogy
    aim: link
    question: What's a parallel situation that reads differently?
    explain:
      - Find a situation with the same shape as the belief, where the same reasoning plainly leads somewhere else. Dilts calls this chunking laterally, moving sideways to a story or a metaphor.
      - You can judge the parallel case without the emotional charge. If the logic fails over there, it's fair to ask why it should hold over here.
  - n: 7
    id: frame_size
    name: Change frame size
    aim: evidence
    question: Zoom the time or the number of people in or out. Does it still mean the same?
    explain:
      - What an event means depends on the frame around it, meaning how long a stretch of time you look at, how many people you include, and how close you stand. Change the frame size and the same fact can mean something new.
      - A bad week looks huge up close and small across a year. A problem that feels personal looks ordinary once you count how many people share it.
  - n: 8
    id: outcome
    name: Better outcome
    aim: conclusion
    question: What outcome would actually be worth aiming at?
    explain:
      - Dilts calls this "another outcome." A limiting belief is usually measured against some goal, often one nobody chose on purpose. This pattern asks whether that goal is the right one and puts a different one in its place.
      - When the target changes, the belief can stop mattering. If the real goal is fewer bad days, "my back will never be perfect" no longer decides anything.
  - n: 9
    id: model
    name: Model of the world
    aim: link
    question: Who would see the same facts and draw a different conclusion?
    explain:
      - Everyone reads the facts through their own map of the world. This pattern asks how someone with a different map, such as a coach, a doctor, or another culture, would read the same evidence.
      - It rests on the NLP maxim that "the map is not the territory." Once you can see another reasonable reading, your conclusion becomes one interpretation among several instead of simply how things are.
  - n: 10
    id: reality
    name: Reality strategy
    aim: evidence
    question: How do you know this is true? What would you have to perceive?
    explain:
      - We don't meet the world directly. We build beliefs from what we notice, remember and imagine. This pattern asks how you know the belief is true, and what you saw, heard or felt that convinced you.
      - The evidence often turns out to be one vivid memory, a feeling, or a guess about what someone else thinks. Questioning how you perceived it loosens the belief from underneath, without arguing with the conclusion.
  - n: 11
    id: counter
    name: Counter example
    aim: evidence
    question: Where does the rule not hold?
    explain:
      - A limiting belief claims a rule, that this always leads to that. One real exception is enough to show the rule isn't absolute.
      - A counter example doesn't argue; it shows. Once the belief has an exception, it has to shrink to fit the facts, and a smaller belief is easier to work with.
  - n: 12
    id: criteria
    name: Hierarchy of criteria
    aim: conclusion
    question: What matters more than what this belief is measuring?
    explain:
      - Beliefs judge things against criteria, like being right, being safe, or being liked. This pattern brings in a criterion you care about more than the one the belief is measuring.
      - The belief doesn't have to be false for this to work. It just stops being in charge. This is how people do the brave thing they believe they can't, because something else mattered more.
  - n: 13
    id: self
    name: Apply to self
    aim: belief
    question: Turn the belief's own judgment back on the belief.
    explain:
      - Take the belief's own logic or standard and turn it on the belief itself. If the belief says something is too expensive, ask how expensive it is to keep believing that.
      - A belief that fails its own test loses its authority. It's the same move as asking a critic whether their criticism meets their own standard.
  - n: 14
    id: meta
    name: Meta frame
    aim: belief
    question: What belief about this belief changes how it looks?
    explain:
      - Step outside the belief and form a belief about it, such as where it came from, when it shows up, or what kind of thinking it is.
      - The original belief may stay the same, but its standing changes. "I only think this when I'm exhausted" doesn't argue with the thought. It puts it in context so you can decide how much weight to give it.

beliefs:
  # ---------- Health ----------
  - id: back
    theme: Health
    label: My back
    evidence: My back has hurt forever
    link: so
    conclusion: I'll never get better
    reframes:
      intention: The belief is trying to protect me from getting my hopes up and being let down again. Good intent, wrong tool.
      redefining: '"Hurt forever" is really "hurt through a long stretch I didn''t yet know how to train through."'
      consequence: Believing it guarantees I skip the rehab, which is the one thing that could change it.
      chunk_down: Which movement, on which day, at what load? "Forever" dissolves into specific reps.
      chunk_up: Bodies are systems that adapt to load. I'm inside a whole class of problems that respond to the right stimulus.
      analogy: A rusty hinge isn't a broken door. It's an un-oiled one.
      frame_size: Will this specific flare-up matter across a year of consistent training?
      outcome: The goal isn't a back that never hurts. It's a back where a flare-up costs me a day, not a month.
      model: A physical therapist reads "hurt for years" as "untrained for years." In her map, chronic is the starting line.
      reality: How do I know it's "forever"? I remember the bad days vividly and the fine days not at all.
      counter: There was a month last year it didn't hurt. If it's "forever," where did that month go?
      criteria: Being strong enough to play with my kids matters more than being right about the prognosis.
      self: How much has holding "I'll never get better" cost me? Has that belief ever bought me a single good rep?
      meta: I believe this most on flare-up days, which is exactly when I'm least able to judge.
  - id: gym
    theme: Health
    label: Skipped the gym
    evidence: I skipped the gym all month
    link: so
    conclusion: I'm just not a fitness person
    reframes:
      intention: The belief spares me the sting of failing again. If I'm "not a fitness person," I can't let myself down. It's a bad trade for that comfort.
      redefining: '"Skipped the gym" is really "haven''t found a time slot that survives my actual week."'
      consequence: Believing it turns one bad month into a permanent excuse, and that's how a skipped month becomes a skipped decade.
      chunk_down: Which days did I skip, and what got in the way each time? Late meetings? A cold? Each one is a scheduling problem, not an identity.
      chunk_up: Every habit stalls when life gets busy, from flossing to reading. This is a habit-under-pressure problem, not a verdict on my body.
      analogy: Missing a month of piano practice doesn't make you "not a music person." It makes you someone who hasn't practiced lately.
      frame_size: Over a lifetime of moving my body, one missed month is a rounding error. Half the people at that gym have had the same month.
      outcome: What I'm after is energy and a body that works, not a label. A twenty-minute walk tomorrow counts toward that.
      model: A good coach reads a skipped month as data about the plan, not the athlete. In her world, the plan was too big.
      reality: What does "a fitness person" look like in my head? Someone who never misses? I've never actually seen inside their months.
      counter: I walked to work every day last spring and loved it. Was that someone else?
      criteria: Being able to keep up with the people I love matters more than whether I fit the label.
      self: If one month is enough to define me, then one good month would redefine me just as fast. The belief can't have it both ways.
      meta: '"Not a ___ person" is a story I tell to avoid the discomfort of starting over. It''s about comfort, dressed up as a fact.'
  - id: sleep
    theme: Health
    label: Night owl
    evidence: I'm wide awake at midnight
    link: so
    conclusion: I'll never be a morning person
    reframes:
      intention: The belief protects the quiet hours I get after everyone's asleep. That time matters. It just doesn't have to come out of my sleep.
      redefining: '"Wide awake at midnight" is really "still looking at a bright screen at midnight."'
      consequence: Believing it means I never try an earlier bedtime, so the evidence for it stays fresh forever.
      chunk_down: Wide awake every night, or the nights I'm on my laptop until 11:30? What happens when I go camping?
      chunk_up: Sleep timing is a rhythm set by light, caffeine and routine. Rhythms shift; they're not a personality.
      analogy: Jet lag feels permanent on the first night too, and then the body catches up within a week.
      frame_size: I've been a "night owl" for a few years. For twelve years before that, I was up at 6:30 for school.
      outcome: I don't need to become a morning person. I need enough sleep to feel good at 3pm.
      model: A sleep doctor would hear "wide awake at midnight" and ask about evening light, my phone and the 4pm coffee, not my destiny.
      reality: How do I know I'm wide awake? I feel alert because I'm scrolling. What would I notice in a dark room with nothing to read?
      counter: On vacation last summer I was asleep by ten and up at sunrise without trying.
      criteria: Being patient and present in the morning matters more than protecting my identity as a night owl.
      self: This belief has repeated itself every night for years. By its own logic, that makes it practiced, not permanent, and practice can change.
      meta: Labels like "night owl" are popular because they make habits sound like biology. That's a belief about the belief.

  # ---------- Work ----------
  - id: boss
    theme: Work
    label: My boss
    evidence: My boss ignores me
    link: which means
    conclusion: he's going to fire me
    reframes:
      intention: The worry is trying to get me ready early so I'm never blindsided. I can get ready without assuming the worst.
      redefining: '"Ignores me" is really "hasn''t answered two emails during reorg week."'
      consequence: Believing it makes me go quiet in meetings, which is the one thing that would actually put me at risk.
      chunk_down: Ignores me where? In 1:1s, in email, in standup? Which of those changed, and since when?
      chunk_up: Managers under load go quiet on everyone. It's a bandwidth signal, not a verdict on me.
      analogy: A pilot in turbulence stops chatting with the passengers. It doesn't mean he's about to eject them.
      frame_size: Across my whole time here, how many quiet weeks were followed by anything bad?
      outcome: What I actually want is to know where I stand. So ask, "What would you like more of from me?"
      model: In his world no news is good news. He only talks to the people whose work is on fire.
      reality: What would I actually see if he were planning to fire me? Am I seeing any of it?
      counter: He ignored Sam all last spring, and Sam got promoted.
      criteria: Doing work I'm proud of matters more than how many replies I get this week.
      self: Am I ignoring him back? This belief has me avoiding the one conversation that would answer it.
      meta: I believe this mostly on Sunday nights, when I'm tired. That's a mood, not a forecast.
  - id: promo
    theme: Work
    label: Passed over
    evidence: I got passed over for promotion
    link: which proves
    conclusion: I'm not leadership material
    reframes:
      intention: The belief wants to protect me from wanting something and missing it twice. It's armor, not an assessment.
      redefining: '"Passed over" is really "not picked this cycle, by these people, against this year''s criteria."'
      consequence: If I believe it, I'll stop volunteering to lead anything, and next cycle there'll be nothing to promote me for.
      chunk_down: What exactly did the feedback say was missing? One skill? One kind of project? "Leadership material" breaks down into things I can practice.
      chunk_up: Promotions are decisions about budgets, timing and team shape. Most of them say little about any one person's ceiling.
      analogy: An actor who loses one role isn't "not acting material." Working actors lose far more auditions than they win.
      frame_size: In ten years, will anyone remember this cycle? Most of the leaders I admire were passed over at least once.
      outcome: I want to grow and to lead something that matters. A promotion is one route there; leading a project next quarter is another.
      model: My mentor calls being passed over the moment you get the most specific feedback of your career. To her it's a map.
      reality: What does "leadership material" look like to me? Have I ever seen it in someone before their promotion, or only after?
      counter: When the launch went sideways last spring, the team followed my calls. That was leadership, with no title.
      criteria: Being someone people trust and want to work with matters more than what level my title says.
      self: One decision proved my whole future? With evidence that thin, this belief wouldn't survive its own review.
      meta: I'm judging my potential from inside the week of the disappointment, when beliefs about ourselves are least reliable.
  - id: speak
    theme: Work
    label: Shaky voice
    evidence: My voice shakes when I present
    link: so
    conclusion: I'm just not a public speaker
    reframes:
      intention: The belief is trying to keep me from being embarrassed in front of people. It does that by taking away the stage.
      redefining: '"Shaking" is really "adrenaline," the same energy that makes a speaker sound alive once it settles.'
      consequence: Believing it, I'll dodge every chance to present, so the shake never gets the practice it needs to fade.
      chunk_down: Does it shake for the whole talk or the first minute? With strangers or with my own team? Usually it's just the opening.
      chunk_up: Nerves before performing are close to universal. Athletes, musicians and surgeons all feel them. It's a human response, not a missing talent.
      analogy: A new driver's hands shake on the highway too. Nobody concludes they're "not a driver."
      frame_size: The audience notices the shake for ten seconds; I remember it for a week. Most of them are relieved it isn't them up there.
      outcome: What counts is that people leave understanding the idea. A shaky voice with a clear point does that.
      model: Plenty of audiences read a little nervousness as sincerity. To them, a perfectly polished speaker can feel like a sales pitch.
      reality: How do I know it shakes that badly? I hear it from the inside, amplified. Have I ever listened to a recording?
      counter: I gave a toast at a friend's wedding and people laughed in the right places. My voice shook then too.
      criteria: Sharing work I care about matters more than how my voice sounds while I share it.
      self: If wavering disqualifies a speaker, this belief wavers every time a talk goes fine. By its own rule, it shouldn't get to speak for me.
      meta: '"I''m just not a ___" is how people describe skills they haven''t practiced yet. It''s a statement about practice, not personality.'
  - id: career
    theme: Work
    label: Too late to switch
    evidence: I'm forty-five
    link: so
    conclusion: it's too late to change careers
    reframes:
      intention: The belief is trying to protect what I've built and the people who depend on me. I can honor that by planning the change carefully.
      redefining: '"Forty-five" is really "twenty years of experience a new field doesn''t have yet."'
      consequence: Holding it guarantees I'll be in this career at sixty, wishing I'd started at forty-five.
      chunk_down: Too late for which part? The training, the pay cut, the hiring? Each has its own answer, and some of them are short.
      chunk_up: People reinvent themselves at every age. Parents go back to school, retirees start companies. It's a life-stage question, not a cutoff.
      analogy: Plant a tree at forty-five and you're sitting in its shade at fifty-five.
      frame_size: With twenty working years left, I'm closer to the start of the rest of my career than to the end of it.
      outcome: I don't have to switch in one leap. I want work that feels alive, and a side project or a lateral move gets me there in steps.
      model: A hiring manager in a new field may see forty-five as judgment and steadiness, the things juniors can't offer.
      reality: Where does "too late" come from? An age on a job posting, or a picture in my head of who's in the room?
      counter: Julia Child published her first cookbook at forty-nine.
      criteria: Not looking back at sixty with regret matters more than the comfort of staying where it's familiar.
      self: If age makes it too late to change, this belief is getting old too. Maybe it's too late for it to keep running my life.
      meta: The fear underneath is about being a beginner again, not about the number. Age is just the respectable reason.
  - id: mistake
    theme: Work
    label: Big mistake
    evidence: I made a big mistake at work
    link: so
    conclusion: everyone thinks I'm incompetent
    reframes:
      intention: The worry is trying to make sure I take the mistake seriously and don't repeat it. I can do that without the self-punishment.
      redefining: '"A big mistake" is really "an expensive lesson that happened in public."'
      consequence: Believing it makes me hide and second-guess everything, and that's what would actually look incompetent.
      chunk_down: Who is "everyone"? Which three people actually know? What did each of them actually say?
      chunk_up: Everyone who does real work makes visible mistakes. That's what doing things looks like, not a measure of skill.
      analogy: A surgeon who handles a complication well earns more trust, not less. People watch the recovery.
      frame_size: In a month this is one line in a retro. Across a career, nobody's record is error-free.
      outcome: Nobody failing to notice was never on the table. What I can get is people seeing me own it and fix it well.
      model: My manager has seen a hundred mistakes. In her world the question is "did they own it?", not "did they ever slip?"
      reality: How do I know what everyone thinks? Am I reading minds, or replaying my own harshest voice?
      counter: When a teammate shipped a broken release last year, I didn't think she was incompetent. I thought she handled it well.
      criteria: Being someone who tells the truth about mistakes matters more than looking flawless.
      self: The belief jumps to a huge conclusion from thin evidence. That's a mistake too, and I'm not calling myself incompetent for that one.
      meta: The shame spike right after a mistake is the worst time to measure my reputation. Ask me again in a week.

  # ---------- Parenting ----------
  - id: teen
    theme: Parenting
    label: Quiet teenager
    evidence: My teenager barely talks to me
    link: which means
    conclusion: we're not close anymore
    reframes:
      intention: The worry is trying to make sure I don't lose my kid. That's love. It just needs a better plan than panic.
      redefining: '"Barely talks" is really "talks less at dinner and more in the car, late at night."'
      consequence: If I believe we're not close, I'll either pull back or push harder, and both make the silence longer.
      chunk_down: Barely talks about what? School, friends, feelings? Which topics still get a full answer?
      chunk_up: Pulling away from parents is how teenagers build their own identity. It's a stage of development, not a verdict on us.
      analogy: A plant pushing against its pot isn't rejecting the pot. It's growing.
      frame_size: Plenty of people are closer to their parents at twenty-five than they were at fifteen. This is a few years of a lifelong relationship.
      outcome: I'd settle for this. When something big happens, I'm the one they call.
      model: To my teenager, privacy is part of growing up, not a lack of love. In their world, not talking can mean "I trust you're there."
      reality: What does "close" look like to me? Long talks? I may be missing the forms it takes now, like the memes and the asking for rides.
      counter: Last week we sat on the couch for an hour watching a show, and they laughed at my jokes. That was closeness without many words.
      criteria: Their becoming their own person matters more than my getting the conversations I want right now.
      self: By its own rule, this belief isn't close to my teen either. It's never asked them anything; it just watches the silence and draws conclusions.
      meta: Almost every parent of a teenager believes this at some point. It's a belief about a stage, dressed up as a belief about us.
  - id: yell
    theme: Parenting
    label: Lost my temper
    evidence: I yelled at my kids again
    link: so
    conclusion: I'm a bad parent
    reframes:
      intention: The guilt is trying to make me a better parent. It just needs to aim at tomorrow morning, not at me.
      redefining: '"Yelled" is really "ran out of patience at the end of a long day."'
      consequence: Believing I'm a bad parent makes me more tired and more on edge, which makes the next yell more likely.
      chunk_down: When did it happen? Mostly at bedtime? Mostly when I'm hungry? The pattern is smaller and more fixable than "bad parent."
      chunk_up: Every parent loses their temper sometimes. It comes with raising humans while being one.
      analogy: A coach who snaps at the team and apologizes the next day isn't a bad coach. The repair is part of the coaching.
      frame_size: My kids will remember thousands of evenings. A few loud ones, repaired, won't define their childhood.
      outcome: Never yelling is the wrong bar. Repairing quickly is the right one, so the kids learn people can mess up and make it right.
      model: Child psychologists talk about rupture and repair. In that model, repair after a blow-up builds trust, and the apology is the lesson.
      reality: How am I measuring "bad parent"? By the worst five minutes of the day, or by the whole week?
      counter: Yesterday I sat through a forty-minute homework meltdown and stayed calm the whole time.
      criteria: Being the parent who apologizes and tries again matters more than being the parent who's never wrong.
      self: Am I yelling at myself right now? I'd never talk to my kid this way about a mistake.
      meta: Only parents who care worry about being bad parents. The belief itself is evidence of the opposite.
  - id: reading
    theme: Parenting
    label: Hates reading
    evidence: My kid hates reading
    link: so
    conclusion: she'll fall behind in school
    reframes:
      intention: The worry is trying to protect her future. The instinct is right; the forecast isn't.
      redefining: '"Hates reading" is really "hates the books she''s been assigned."'
      consequence: If I believe it, I'll push harder, reading becomes a fight, and the fight is what would make her hate it.
      chunk_down: Hates which books? Does she read comics, game guides, messages from friends? She reads a lot of something.
      chunk_up: Kids go through phases with everything from vegetables to sports. Tastes change, and this is one phase.
      analogy: Lots of kids who refused vegetables at seven eat salad at seventeen. Forced bites rarely did it.
      frame_size: Across twelve years of school, one year of not loving books is a small slice. Plenty of kids in her class feel the same.
      outcome: Loving books would be nice. What she needs is to be able to learn whatever she wants, and there are many roads there.
      model: Her teacher sees reluctant readers every year. To her, it means "hasn't found her book yet."
      reality: How do I know she's falling behind? Has the school said so, or am I comparing her to the neighbor's kid?
      counter: She read an entire Minecraft handbook twice last month, without being asked.
      criteria: Her being curious and confident matters more than how many pages she reads a night.
      self: The belief reads one chapter of her life and predicts the ending. By its own standard, that's poor reading.
      meta: Parents worry most about the skills they care about most. This says as much about what I love as about what she needs.

  # ---------- Money ----------
  - id: save
    theme: Money
    label: Can't save
    evidence: I've never managed to save
    link: so
    conclusion: I'm just bad with money
    reframes:
      intention: The belief shields me from the shame of trying and failing again. If I'm "bad with money," failing is expected.
      redefining: '"Never managed to save" is really "never had a system that saved for me before I could spend it."'
      consequence: If I'm "bad with money," why bother learning? Not learning is the thing that keeps me bad with it.
      chunk_down: Which months went wrong? Rent, eating out, one emergency? The leak is probably two or three line items.
      chunk_up: Saving is a design problem. Most people who save have it taken out automatically. It's about systems, not character.
      analogy: People who "can't keep plants alive" often just never set up the watering. Add a drip line and the plant lives.
      frame_size: Most people save almost nothing in their twenties. Ten steady years starting now still add up.
      outcome: Forget becoming "good with money." I want three months of cushion, so a car repair isn't a crisis.
      model: A financial planner hears "I've never managed to save" every week. In her world it means "hasn't automated it yet."
      reality: What does "good with money" look like to me? Have I ever checked what I actually spend, or am I going on a feeling?
      counter: I saved for six months to pay for that trip to Lisbon. I can do it when the goal is clear.
      criteria: Feeling secure matters more than proving I'm the "type" who saves. I can get security without changing my type.
      self: As investments go, this belief is a bad one. It's cost me years of not trying and paid nothing back.
      meta: '"Bad with money" is usually inherited. Is this my belief, or something I heard at home growing up?'
  - id: debt
    theme: Money
    label: In debt
    evidence: I have twenty thousand in debt
    link: so
    conclusion: I'll never get ahead
    reframes:
      intention: The belief is trying to stop me pretending the hole isn't there. Facing the number is good; giving up isn't.
      redefining: '"Twenty thousand in debt" is really "a balance with a payoff date I haven''t calculated yet."'
      consequence: Believing I'll never get ahead makes me stop tracking it, and untracked debt is the kind that grows.
      chunk_down: Twenty thousand split how? Which card has the highest rate? Paying that one first changes the math.
      chunk_up: Debt is a math problem with known solutions, like the avalanche or the snowball. Millions of people have solved this exact one.
      analogy: A mountain looks impossible from the bottom. Climbers look at the next switchback, not the summit.
      frame_size: At five hundred a month it's gone in about four years. Across a forty-year working life, that's a short chapter.
      outcome: '"Getting ahead" is vague. A goal I can hit: no high-interest debt by a date I pick.'
      model: To a bank, twenty thousand is an ordinary balance on an ordinary customer. They expect it to be paid down, and so can I.
      reality: How do I know it's "never"? Have I run the numbers, or does it just feel like never when I open the statement?
      counter: I paid off my car loan two years ago. I already know how to get a balance to zero.
      criteria: Sleeping well matters more than how fast I get ahead. A plan, even a slow one, gives me that tonight.
      self: This belief charges interest too. Every month I hold it, I pay in stress and avoidance.
      meta: I believe this most when I open the statement, the moment I'm most scared. Fear is a bad accountant.

  # ---------- Habits ----------
  - id: phone
    theme: Habits
    label: Phone first thing
    evidence: I check my phone the moment I wake up
    link: so
    conclusion: I have no willpower
    reframes:
      intention: The belief is trying to get me to change something. It just aimed at my character, which can't be changed head-on.
      redefining: '"No willpower" is really "a phone built by thousands of people to be checked, sitting next to my pillow."'
      consequence: If I believe I have no willpower, I won't try anything that needs a choice, which leaves the phone in charge.
      chunk_down: Is it the first minute or the first hour? Email, news, messages? Which one pulls hardest?
      chunk_up: Habits are driven by cues and environment more than by willpower. This is an environment problem.
      analogy: Keeping cookies on the counter and calling yourself weak for eating them blames the person for the kitchen design.
      frame_size: It's ten minutes out of sixteen waking hours, and most people I know do the same thing every morning.
      outcome: I don't need heroic willpower. I need the phone charging in the kitchen, so the choice never comes up.
      model: Behavior designers treat willpower as the last line of defense. In their world, you change the setup, not the person.
      reality: How do I know I have "no" willpower? Am I counting the one habit I lose and ignoring the ones I keep?
      counter: I get through a long workday without raiding the snack drawer. I show up for friends when I'm tired. That's willpower.
      criteria: Starting my day on my own terms matters more than winning an argument about my character.
      self: I reach for this belief every morning too, automatically, without deciding to. It's the same habit loop, and it breaks the same way.
      meta: '"No willpower" is the explanation people reach for before they know how habits work. It''s an old theory, not a fact about me.'
  - id: streak
    theme: Habits
    label: Broke my streak
    evidence: I broke my meditation streak
    link: so
    conclusion: there's no point starting again
    reframes:
      intention: The belief is trying to avoid the disappointment of breaking another streak. Guarding against disappointment, it guards against practice.
      redefining: '"Broke my streak" is really "took a day off from a practice that was going fine."'
      consequence: If there's no point starting again, forty days of practice drop to zero for good, over one missed day.
      chunk_down: What did the forty days actually give me? Calmer mornings? Those didn't vanish when the counter reset.
      chunk_up: Every practice has gaps. Athletes get injured, writers miss days. Consistency over time matters, not unbroken chains.
      analogy: If you miss a stair, you don't throw yourself down the rest of the flight.
      frame_size: Forty days on, one off. Over a year, that's a 97-percent practice, not a failure.
      outcome: The point was a calmer mind, not the streak, and that's available again tomorrow at 7am.
      model: In many meditation traditions, noticing you drifted and coming back is the practice. Starting again is the meditation.
      reality: Why does a reset counter feel like failure? Because an app shows a zero. Would I feel this way without the app?
      counter: I broke my running streak in March, started again a week later, and I'm still running.
      criteria: Being kind to myself matters more than a perfect record, and meditation is supposed to teach exactly that.
      self: The belief says one break ends a practice. Then one break from this belief should end it too.
      meta: All-or-nothing thinking is a habit of mind that meditation is meant to loosen. This belief is a great thing to meditate on.
  - id: procrastinate
    theme: Habits
    label: Last minute
    evidence: I always leave things to the last minute
    link: because
    conclusion: I'm lazy
    reframes:
      intention: The belief is trying to push me to do better by insulting me into it. That hasn't worked yet.
      redefining: '"Leaving things to the last minute" is really "waiting until the deadline makes the task feel real."'
      consequence: Calling myself lazy makes starting feel even heavier, which means more waiting.
      chunk_down: Which things? Quick emails or big reports? The tasks I know how to do, or the ones I'm unsure about?
      chunk_up: Procrastination is mostly a way of dodging uncomfortable feelings like uncertainty or fear of being judged. That's emotion, not laziness.
      analogy: A car that won't start on a cold morning isn't lazy. It needs to warm up.
      frame_size: Over a year, how many things did I finish on time, even at the last minute? Almost all of them.
      outcome: I'm not trying to stop being "lazy." I'm trying to spend the first ten minutes early, while the stakes are low.
      model: A psychologist would say lazy people don't lose sleep over deadlines. They'd call what I do avoidance, which is a different problem.
      reality: How do I know I'm lazy? Do lazy people stay up until 2am to hit a deadline?
      counter: I spent a whole Saturday fixing a friend's bike without being asked. Lazy people don't do that.
      criteria: Being kind to myself while I change matters more than being right about my character.
      self: This belief is the laziest thought I have. One word, no investigation, done.
      meta: People who call themselves lazy are often the ones who care most about doing well. The label is perfectionism in disguise.

  # ---------- Relationships ----------
  - id: friends
    theme: Relationships
    label: No new friends
    evidence: I haven't made a new friend in years
    link: so
    conclusion: it's too late to make friends as an adult
    reframes:
      intention: The belief is trying to protect me from rejection. It also protects me from connection.
      redefining: '"Haven''t made a new friend" is really "haven''t seen the same people every week since school ended."'
      consequence: Believing it, I'll turn down the invitations that would prove it wrong.
      chunk_down: Where have I actually tried? Work, the gym, the neighborhood? When did I last see someone more than twice?
      chunk_up: Adult friendships form through repeated, unplanned contact. That's about structure, not age.
      analogy: A garden where nothing was planted doesn't prove the soil is too old.
      frame_size: I have decades left to make friends. A few years without a new one is a short dry spell.
      outcome: I don't need a crowd of new friends. One person to grab coffee with every few weeks would change a lot.
      model: The organizer of a local running club watches strangers become friends every season. In her world, adults make friends all the time.
      reality: What does making a friend feel like to me? Am I waiting for instant closeness, when adult friendships rarely start that way?
      counter: A neighbor became a real friend at thirty-eight, after we kept running into each other walking our dogs.
      criteria: Feeling connected matters more than avoiding the awkwardness of a first invitation.
      self: The belief says it's too late to start something new. It only showed up in the last few years itself, so it's not too late to drop it.
      meta: Lots of adults believe this, which means lots of adults are waiting for someone else to make the first move. That's an opening.
  - id: fight
    theme: Relationships
    label: Same fight
    evidence: We had the same fight again
    link: which means
    conclusion: we're not right for each other
    reframes:
      intention: The belief is trying to keep me from wasting years on something that won't work. Reasonable, but it's jumping ahead.
      redefining: '"The same fight" is really "the same unmet need, coming up again."'
      consequence: If I believe we're not right for each other, I'll stop trying to solve the fight, and that's what actually ends relationships.
      chunk_down: What is the fight really about? The dishes, or feeling unappreciated? What happens in the first two minutes?
      chunk_up: Most couples have a few recurring conflicts that never fully go away. That's how relationships work, not proof of a mismatch.
      analogy: When the same knee keeps hurting in the same spot, that joint needs attention. It doesn't mean you need new legs.
      frame_size: How many days this month did we get along? The fight took one evening; the good days took the rest.
      outcome: Never fighting isn't the aim. Fighting so that we both feel heard at the end is.
      model: John Gottman's research found that most couple conflicts are perpetual. In his model, managing them well is what lasting couples do.
      reality: How do I know we're not right for each other? Is it a pattern over years, or how I feel ten minutes after the fight?
      counter: Last time we talked it through and ended up laughing about the dishwasher.
      criteria: The life we've built and the way we laugh together matter more than winning this argument.
      self: This belief keeps having the same fight with me, too. By its own logic, maybe it's the belief that's wrong for us.
      meta: Right after a fight is the worst time to judge a whole relationship. This is a belief about tonight, not about us.
  - id: dating
    theme: Relationships
    label: Dates going nowhere
    evidence: My last three dates went nowhere
    link: so
    conclusion: nobody's interested in me
    reframes:
      intention: The belief is trying to protect me from more disappointment. It does that by keeping me home.
      redefining: '"Went nowhere" is really "weren''t a match," which is what most dates are.'
      consequence: If nobody's interested, why try? So I stop dating, and that's how the belief comes true.
      chunk_down: What actually happened on each date? Was there a good conversation? Did I even want a second date with them?
      chunk_up: Dating is a matching process, and most combinations don't fit. That's how it works for everyone.
      analogy: A salesperson doesn't quit after three noes. Most deals close after many conversations.
      frame_size: Three dates out of a lifetime. Most happily married people went on plenty of dates that went nowhere.
      outcome: I don't need everyone to be interested. I need one person I'm excited about who feels the same.
      model: A friend who met her partner online went on twenty first dates first. To her, three is just getting started.
      reality: How do I know they weren't interested? Did they say so, or did I decide it from a slow reply?
      counter: Someone asked me out at a party last year. I said no, but they were clearly interested.
      criteria: Being with someone who's right for me matters more than being liked by everyone I meet.
      self: Three data points and the verdict is "nobody"? If a date judged me that fast, I'd say they weren't paying attention.
      meta: '"Nobody" is the hurt talking. Hurt is real, but it''s not a statistician.'

  # ---------- Self-image ----------
  - id: math
    theme: Self-image
    label: Not a numbers person
    evidence: I failed math in school
    link: so
    conclusion: I'm not a numbers person
    reframes:
      intention: The belief protects me from feeling stupid again. It's a shield from an old classroom.
      redefining: '"Failed math" is really "failed one class, taught one way, when I was fifteen."'
      consequence: Believing it, I avoid anything with numbers, including my own budget and the parts of work that would pay more.
      chunk_down: Failed which part? Proofs? Timed tests? I can split a bill and double a recipe without thinking.
      chunk_up: Most adults who "aren't math people" had one bad teacher or one bad year. That's an experience, not a gene.
      analogy: Someone cut from the school basketball team can still learn to play at forty. Nobody calls them "not a ball person."
      frame_size: That was one year, decades ago. I've done thousands of calculations since then without noticing.
      outcome: I don't need to love math. I need to be comfortable enough to read a spreadsheet and check a loan offer.
      model: Many math teachers believe nearly anyone can learn math taught the right way. In their world there's no such thing as a numbers person.
      reality: What makes someone a "numbers person" in my mind? Fast mental arithmetic? Is that even what math is?
      counter: I keep my fantasy-league stats in my head better than anyone in the league. That's numbers.
      criteria: Understanding my own finances matters more than protecting a label I picked up at fifteen.
      self: The belief does its own math. One bad grade equals a whole life. By its own standard, that answer gets marked wrong.
      meta: I learned this belief from a grade on a page, not from evidence. Kids don't pick these labels carefully.
  - id: creative
    theme: Self-image
    label: Not creative
    evidence: My drawings look like a child's
    link: so
    conclusion: I'm not creative
    reframes:
      intention: The belief is trying to protect me from being judged. If I'm "not creative," nobody can criticize my art.
      redefining: '"Like a child''s" is really "like a beginner''s," and every artist was one.'
      consequence: If I'm not creative, I won't draw, and my drawings will stay at a child's level for good.
      chunk_down: Which parts look childlike? Proportions? Shading? Each of those is a skill people learn in a few weeks.
      chunk_up: Creativity shows up in how you cook, solve problems and tell stories. Drawing is one narrow slice of it.
      analogy: A first-year piano student sounds clumsy. Nobody calls them "not musical"; they say they're starting.
      frame_size: I've drawn for maybe ten hours in my whole adult life. Give it a hundred and see.
      outcome: Drawing like a professional was never the point. Enjoying making something with my hands is.
      model: Picasso is often quoted as saying he spent a lifetime learning to paint like a child. In that model, the childlike look is what artists chase.
      reality: How am I judging whether something is creative? By comparing it to the best art I've ever seen?
      counter: The birthday card I made last year got pinned to the fridge and is still there. That was creative.
      criteria: The joy of making things matters more than whether they look impressive.
      self: For a belief about creativity, it's remarkably uncreative. One sketch, one label, a whole person.
      meta: '"I''m not creative" is what adults say about things they stopped practicing at ten. It''s a belief about stopping.'
  - id: age
    theme: Self-image
    label: Getting older
    evidence: I'm getting older
    link: so
    conclusion: my best years are behind me
    reframes:
      intention: The belief is trying to make me value my time and not waste it. Good intent, but it points backward instead of forward.
      redefining: '"Getting older" is really "piling up experience, perspective and people."'
      consequence: Believing my best years are behind me makes me stop starting things, which is what would make it true.
      chunk_down: Best at what, exactly? My knees, sure. My judgment? My friendships? My patience?
      chunk_up: Every stage of life has its own strengths. Youth has energy; later life has perspective. "Best" depends on what you measure.
      analogy: The second half of a book is often where the story gets good.
      frame_size: Studies of happiness across the lifespan often find it rises again after middle age. Plenty of people are happiest in their sixties and seventies.
      outcome: My best years don't have to be ahead of me. I'd like the next few to be good ones, on purpose.
      model: In many cultures, elders hold the most respect and influence. Their best years are their later ones.
      reality: How do I know my best years are behind me? Am I comparing an edited memory of my twenties to an unedited Tuesday now?
      counter: Grandma Moses started painting seriously in her late seventies and kept at it past a hundred.
      criteria: Living well today matters more than ranking which years were best.
      self: This belief is getting older too. By its own logic, its best years are behind it.
      meta: This thought shows up at certain ages for almost everyone. It's a phase of thinking, not a fact about life.
