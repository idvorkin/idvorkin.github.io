name: Deploy to GitHub Pages

# Replaces GitHub Pages' native Jekyll build.
#
# Why: the derived indexes (Pagefind search index, back-links.json) have to be
# generated AFTER Jekyll builds the site, and the native Pages build has no
# post-build hook. Building them here means the deployed copy is produced fresh
# on every deploy and can never drift from published content — and, unlike the
# old update-backlinks.yml, nothing has to push a generated file back to main.
#
# The site is built by Zola through zola/build.sh: a shim over the unchanged
# Jekyll sources (Jekyll's own Liquid for layouts, includes and listings;
# kramdown's rules carried into CommonMark), whose output has Jekyll's shape.
# zola/DESIGN.md explains it. The Jekyll build lives on as pages-jekyll.yml,
# a by-hand rollback.
#
# ONE-TIME SETUP: repo Settings -> Pages -> Source must be set to "GitHub Actions".
# Until that is flipped, this workflow runs green but the live site still comes
# from the native build.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  # 2026-08-12: run 31560670448 sat in `queued` 10+ hours and blocked every run
  # behind it — when false, a stuck run in this group is never superseded. Build
  # is ~1 min so the window for killing a legit deploy is small; a wedged run
  # blocks publishing indefinitely. Deviates from GitHub's Pages starter
  # template, which sets false so production deployments can complete.
  cancel-in-progress: true

# Deploy credentials live on the deploy job only — build runs third-party
# tooling (pagefind off npm) and needs nothing beyond repo read.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # The back-links builder derives each page's last_modified from
          # `git log -1 -- <file>`. A shallow checkout grafts the tip commit to
          # have no parents, so git reports EVERY tracked file as added by it —
          # verified locally: the same commit shows 3 changed files in a full
          # clone and 1020 in a `--depth 1` one. Every page would then be
          # stamped with the deploy commit's date.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build JS bundle
        run: |
          npm ci
          npm run build

      - uses: astral-sh/setup-uv@v7

      - name: Install Zola (version pinned in zola/ZOLA_VERSION)
        run: |
          ZOLA_VERSION=$(cat zola/ZOLA_VERSION)
          curl -sSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | sudo tar -xz -C /usr/local/bin zola
          zola --version

      # back-links.json is built by tools/backlinks (Rust). Cache the release
      # binary itself, keyed on everything that compiles into it, so a deploy
      # that does not touch the crate spends no time in cargo. A miss compiles
      # it with the runner's preinstalled toolchain (about half a minute).
      - name: Restore the back-links builder
        id: backlinks-bin
        uses: actions/cache@v4
        with:
          path: ~/.cache/backlinks-bin
          key: backlinks-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/backlinks/Cargo.lock', 'tools/backlinks/Cargo.toml', 'tools/backlinks/src/**') }}

      - name: Compile the back-links builder (cache miss only)
        if: steps.backlinks-bin.outputs.cache-hit != 'true'
        run: |
          cargo build --release --locked --manifest-path tools/backlinks/Cargo.toml --target-dir tools/backlinks/target
          mkdir -p ~/.cache/backlinks-bin
          cp tools/backlinks/target/release/backlinks ~/.cache/backlinks-bin/

      - name: Build site (Zola), back-links and Pagefind
        # CI's merged config (_config_ci.yml's exclude: list replaces the main
        # one, as Jekyll's --config a,b does) and page dates in UTC, as the
        # Jekyll build had them. STRICT fails on an unknown Liquid filter.
        # build.sh runs tools/backlinks and Pagefind itself.
        env:
          TZ: UTC
          JEKYLL_CONFIG: _config.yml,_config_ci.yml
        run: BACKLINKS_BIN="$HOME/.cache/backlinks-bin/backlinks" OUT="$PWD/_site" WORK="$PWD/.zola-work" STRICT=1 BACKLINKS=1 PAGEFIND=1 zola/build.sh

      - name: Verify search index and exclusions
        run: ./scripts/verify-search-index.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
