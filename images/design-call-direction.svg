<svg xmlns="http://www.w3.org/2000/svg" width="140" height="318" viewBox="0 0 140 318" role="img" aria-labelledby="t">
  <title id="t">Library: your code calls the library. Framework: the framework calls your code.</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "DejaVu Sans", sans-serif; text-anchor: middle; dominant-baseline: central; }
    .h { font-size: 15px; font-weight: 700; fill: #1b1f24; }
    .b { font-size: 15px; font-weight: 700; }
    .c { font-size: 13px; fill: #5a636e; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1b1f24"/>
    </marker>
  </defs>
  <!-- Library: your code calls the library -->
  <text class="h" x="70" y="10">Library</text>
  <rect x="2" y="24" width="136" height="38" rx="4" fill="#e8f1f5" stroke="#2f6f8f" stroke-width="3"/>
  <text class="b" x="70" y="43" fill="#2f6f8f">Your code</text>
  <line x1="70" y1="65" x2="70" y2="95" stroke="#1b1f24" stroke-width="2.5" marker-end="url(#a)"/>
  <text class="c" x="98" y="80">calls</text>
  <rect x="2" y="100" width="136" height="38" rx="4" fill="#eef0f2" stroke="#4b5563" stroke-width="3"/>
  <text class="b" x="70" y="119" fill="#4b5563">Library</text>
  <!-- divider -->
  <line x1="20" y1="156" x2="120" y2="156" stroke="#d8dbe0" stroke-width="1.5"/>
  <!-- Framework: the framework calls your code -->
  <text class="h" x="70" y="174">Framework</text>
  <rect x="2" y="188" width="136" height="38" rx="4" fill="#eef0f2" stroke="#4b5563" stroke-width="3"/>
  <text class="b" x="70" y="207" fill="#4b5563">Framework</text>
  <line x1="70" y1="229" x2="70" y2="259" stroke="#1b1f24" stroke-width="2.5" marker-end="url(#a)"/>
  <text class="c" x="98" y="244">calls</text>
  <rect x="2" y="264" width="136" height="38" rx="4" fill="#e8f1f5" stroke="#2f6f8f" stroke-width="3"/>
  <text class="b" x="70" y="283" fill="#2f6f8f">Your code</text>
  <text class="c" x="70" y="311">in its slots</text>
</svg>
