<svg xmlns="http://www.w3.org/2000/svg" width="220" height="236" viewBox="0 0 220 236" role="img" aria-labelledby="t">
  <title id="t">Business Logic on top, Platforms at the bottom, Goop in between binding the two</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 21px; text-anchor: middle; dominant-baseline: central; }
  </style>
  <!-- Business Logic -->
  <rect x="2" y="2" width="216" height="58" rx="4" fill="#e8f1f5" stroke="#2f6f8f" stroke-width="3"/>
  <text x="110" y="31" fill="#2f6f8f">Business Logic</text>
  <!-- joints: goop fastened to the layer above -->
  <g fill="#a8741a">
    <rect x="44" y="60" width="5" height="28" rx="2"/>
    <rect x="107.5" y="60" width="5" height="28" rx="2"/>
    <rect x="171" y="60" width="5" height="28" rx="2"/>
  </g>
  <!-- Goop -->
  <rect x="2" y="89" width="216" height="58" rx="4" fill="#f8f0e0" stroke="#a8741a" stroke-width="3" stroke-dasharray="8 5"/>
  <text x="110" y="118" fill="#a8741a">Goop</text>
  <!-- joints: goop fastened to the layer below -->
  <g fill="#a8741a">
    <rect x="44" y="148" width="5" height="28" rx="2"/>
    <rect x="107.5" y="148" width="5" height="28" rx="2"/>
    <rect x="171" y="148" width="5" height="28" rx="2"/>
  </g>
  <!-- Platforms -->
  <rect x="2" y="176" width="216" height="58" rx="4" fill="#eef0f2" stroke="#4b5563" stroke-width="3"/>
  <text x="110" y="205" fill="#4b5563">Platforms</text>
</svg>
