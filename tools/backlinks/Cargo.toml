[package]
name = "backlinks"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Builds back-links.json from the built site (port of build_back_links.py build)"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
ego-tree = "0.11"
html5ever = "0.40.1"
indexmap = "2"
rayon = "1.12.0"
regex = "1.13.2"
scraper = { version = "0.29.0", default-features = false }
serde = "1"
serde_json = "1.0.154"

# Every edit to the crate compiles it, so the profile is set for rebuild time:
# incremental, the default 16 codegen units, no cross-crate LTO. An edit
# rebuilds in ~1 s; the output is the same bytes, and the run costs ~5% more
# than a fully optimised build (convert ~0.95 s of a site build).
[profile.release]
incremental = true
