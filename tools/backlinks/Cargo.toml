[package]
name = "backlinks"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Builds back-links.json from the built site (port of build_back_links.py build)"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
ego-tree = "0.11"
html5ever = "0.40.1"
indexmap = "2"
rayon = "1.12.0"
regex = "1.13.2"
scraper = { version = "0.29.0", default-features = false }
serde = "1"
serde_json = "1.0.154"

[profile.release]
codegen-units = 1
lto = "thin"
