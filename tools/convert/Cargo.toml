[package]
name = "zolaconvert"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "The kramdown -> CommonMark fixes of zola/convert.py, as a Python extension"

[lib]
name = "zolaconvert"
crate-type = ["cdylib"]

[dependencies]
indexmap = "2"
pcre2-sys = "0.2.10"
pyo3 = { version = "0.27.2", features = ["abi3-py310", "extension-module"] }

[build-dependencies]
pyo3-build-config = "0.27.2"

[profile.release]
codegen-units = 1
lto = "thin"
