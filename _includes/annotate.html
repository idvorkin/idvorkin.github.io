<!--
  annotate.html — Igor's private blog annotation tool.

  KEEP IN SYNC (Igor 2026-11-21): this file is the spec for the explainer
  sites' copy, idvorkin-ai-tools.github.io/assets/annotate.js. A fix or
  feature here is ported there in the same change, or filed the same day.

  NO NETWORK UNTIL USED. Every reader gets a 💬 toggle (Igor 2026-11-21:
  "everyone can see the chat box") that turns Comments mode on and off live
  (no reload; aria-pressed and a blue fill say it is on; the tooltip names
  the page path). Here it sits in the navbar right after the navbar's own
  GitHub link to this post's source; a layout without that link gets the
  explainers' floating top-right pair instead (GitHub link from
  `page.path` + toggle, placed under any header band). Building it is DOM
  only: no request until the reader sends something, and none ever to a
  Cockpit this browser has not saved.

  OWNER vs READER. The setup prompts (Cockpit address, GitHub token), the
  `#larry-cockpit=` fragment, the status dot and the open-PR badge are the
  owner's alone. A browser is the owner's once ?annotate=1 or the shortcut
  has been used there (localStorage `blogAnnotateOwner`), or it has a saved
  token or Cockpit address, or it is on localhost or the tailnet, or it
  already had Comments on before the toggle shipped (`blogAnnotate=1` with
  no `blogAnnotateToggleSeen`, which the first toggle click writes). A
  reader without Larry can still comment; Send opens the review card with
  "Copy for Igor" (readable text led by the page URL), plus "Upload to
  gist" only when a token is saved.

  Enable  : visit any post with ?annotate=1  (persists; marks owner)
  Disable : visit any post with ?annotate=0
  Toggle  : the 💬 button, or Cmd/Ctrl+Shift+A on desktop (marks owner)
  Banner  : "💬 Comments" in the local dev banner toggles it live (no reload)

  Once enabled: select text -> a small "Comment" bubble appears near the
  selection -> tap it -> type a note -> pick an intent -> Save
  (or Cmd/Ctrl+Enter; Escape cancels). Notes buffer in localStorage.
  Enter-Enter also saves, for hands-free dictation: at the END of a
  non-empty note, a second trailing newline within ENTER_SAVE_MS (400 ms) of
  the first, or one change that appends two or more trailing newlines,
  trims the trailing whitespace and saves with the selected intent. Slow
  Enters and Enters mid-text stay line breaks (see noteEnterStep).
  The "Review (N)" pill uploads the batch to a SECRET gist (description
  `blog-review: <permalink>`) or copies it to the clipboard.

  INTENT: one tap, seven choices (fix / cut / rewrite / expand / check /
  question / note), default `note`. Phone annotation produces terse comments
  and "this is wordy" is ambiguous between cut, rewrite, and idle observation.
  One tap is the right cost; freeform per-note agent instructions are
  deliberately NOT offered, because prose turns annotating into prompt-writing.

  PAGE VERSION: recorded per annotation so a stale anchor is detectable later.
  What this site actually exposes was checked before writing this (2026-08):

    * No `last_modified_at` in any `_d/*.md` frontmatter (0 of 266).
    * `_config.yml` loads only jekyll-redirect-from + jekyll-paginate; nothing
      in _layouts/_includes references `site.github.*`, so there is NO
      `site.github.build_revision` and no git SHA in the built page.
    * The served HTML carries no generator / revision / version meta tag.
    * GitHub Pages DOES send a real `Last-Modified` header, which the browser
      surfaces as `document.lastModified` — but it is the SITE DEPLOY time,
      byte-identical across every page (verified: /timeoff-2026-07, /22 and
      /40yo all returned the same value). It identifies the build, not the post.

  So the marker below is: the deploy stamp (real, coarse) plus a length and an
  FNV-1a digest of the rendered article text (exact, per-post, derived from the
  bytes actually annotated). blog_review.py adds the per-post signal git
  already knows: whether the markdown was committed after the note was written.

  ORIGIN: recorded next to every `permalink`, at both the batch and the
  annotation level. `permalink` alone cannot tell you WHICH server you were
  reading — a note taken against the local Jekyll preview and one taken
  against the live site are byte-identical without it. `location.origin` is
  scheme + host + port, so `https://idvork.in` and
  `http://<machine>.<tailnet>.ts.net:4000` are distinguishable.

  `location.href` is deliberately NOT recorded: beyond origin + permalink it
  only adds the query string and fragment, which here means `?annotate=1` and
  whatever heading you last clicked — tool state, not page identity.

  SECURITY: the GitHub PAT lives ONLY in this browser's localStorage under
  `blogAnnotateToken`. It is never committed, never sent anywhere except
  api.github.com. Use a fine-grained/classic token with the `gist` scope
  ONLY — nothing else.

  DIFF VIEW: the dev banner's "Diff vs main" (src/rich-diff.ts) hides the
  article and shows a rendered diff in its place. A selection there is handed
  to src/annotate-anchor.ts (window.blogAnnotateDiffSelector, registered by
  the diff), which drops struck-out text and re-anchors the quote against the
  real article, so the note is the one you'd get selecting on the page. It
  adds `diff: {inserted: all|some|none, anchoredTo: page|diff-view}`. The page
  version is always measured on the real article, never the diff DOM.

  Larry reads the batches back with scripts/blog_review.py.

  SEND TO LARRY: the pill always has a "Send to Larry" button next to Open,
  greyed out while nothing is buffered or a send is in flight. Send groups
  the buffer into one batch per page and clears only the batches that were
  delivered; on any failure the buffer stays and the review card opens with
  the gist/clipboard fallback. Where a batch goes depends on the host:

    * Tailnet host (`location.hostname` ends in `.ts.net`) or localhost: to
      the Cockpit on the SAME hostname over https at the default port
      (`/blog-review`); no host is written here. Only these hosts get the
      status dot (`/larry/status`): green when Larry is idle, amber when
      busy, red when down or unreachable (off the tailnet).
    * Anywhere else (idvork.in) with a saved Cockpit address: the same POST
      and status dot, against the origin in localStorage `blogLarryCockpit`
      (that Cockpit must allow CORS from this site, plus the
      Private-Network preflight). The address is saved once, either by the
      prompt on the first Send or by opening any page with the fragment
      `#larry-cockpit=<origin>` (a fragment, never a query, so it stays out
      of server logs; it strips itself, and asks before replacing a
      different saved address). The fragment is saved only in the owner's
      browser (see OWNER vs READER); on a new device open
      `?annotate=1#larry-cockpit=<origin>`. Only an https origin on a tailnet name or
      localhost is accepted, origin only, re-checked on every read. A POST
      that fails, errors or hangs past COCKPIT_TIMEOUT_MS sends that batch
      and the rest of the Send to gists below (token asked for only then).
    * Fallback, or a Send whose address prompt was cancelled: one SECRET
      gist per batch, through the same gist write and token as "Upload to
      gist". Description
      `blog-review: <permalink>`, one file `review.json`: the upload's shape
      plus `schema: "blog-review-batch/1"`, `batch_id`, `via: "send"`,
      `page_url`, `site_url` and `source_path`. A watcher lists the token
      owner's gists (`GET /gists?since=…`), takes those with the
      description prefix it has not seen, and dedupes resends on `batch_id`.
      No gist id is written here: every batch makes its own gist.

  OPEN PRS: in comment mode the pill also says "This page has N open PR(s)"
  with links, when an open PR on idvorkin/idvorkin.github.io changes this
  page's source file (`page.path`, e.g. `_d/whats-left.md`). It reads
  GitHub's public API unauthenticated (60 requests/hour per IP): one list of
  open PRs plus one file list per PR, cached in sessionStorage for
  PR_CACHE_MS, and any failure shows nothing. The gist token is never sent
  there. Readers never trigger it: it runs only after the flag check.
-->

<!--
  Page identity is passed through data attributes rather than interpolated
  into the <script> body: Liquid tags inside JS are not valid JS, and the
  repo's prettier hook parses script contents.
-->
<div
  id="blog-annot-meta"
  data-permalink="{{ page.url }}"
  data-title="{{ page.title | default: '' | escape }}"
  data-site-url="{{ site.url }}"
  data-source-path="{{ page.path }}"
  hidden
></div>

<script>
  (function () {
    "use strict";

    var FLAG_KEY = "blogAnnotate";
    var TOKEN_KEY = "blogAnnotateToken";
    var BUF_KEY = "blogAnnotateBuffer";
    var COCKPIT_KEY = "blogLarryCockpit"; // saved Cockpit origin, off-tailnet
    var COCKPIT_TIMEOUT_MS = 8000; // a hung POST off the tailnet falls back
    var PR_CACHE_KEY = "blogAnnotateOpenPrs"; // sessionStorage
    var PR_CACHE_MS = 10 * 60 * 1000;
    var REPO_API = "https://api.github.com/repos/idvorkin/idvorkin.github.io";
    var CTX = 30; // chars of prefix/suffix context (W3C TextQuoteSelector)
    var ENTER_SAVE_MS = 400; // two trailing Enters this close together save the note

    // Enter-Enter save rule, decided from the textarea's value before and
    // after one input event (not keydown: dictation and phone keyboards
    // often send no usable Enter key). `lastAt` is when the previous event
    // appended a lone trailing newline, or null. A change counts only when
    // it appends to the old value with the caret at the end; its trailing
    // whitespace run gives the number of Enters it added.
    function noteEnterStep(prev, next, caretAtEnd, lastAt, now) {
      if (!caretAtEnd || next.slice(0, prev.length) !== prev) {
        return { save: false, lastAt: null };
      }
      var tail = /\s*$/.exec(next.slice(prev.length))[0];
      var enters = tail.split("\n").length - 1;
      var hasText = next.trim() !== "";
      if (enters >= 2) return { save: hasText, lastAt: null };
      if (enters === 0) return { save: false, lastAt: null };
      if (hasText && lastAt !== null && now - lastAt <= ENTER_SAVE_MS) {
        return { save: true, lastAt: null };
      }
      return { save: false, lastAt: now };
    }

    // The open PRs (from loadOpenPrs) whose changed files include this page's
    // source file. `path` is Jekyll's `page.path`, relative to the repo root.
    function prsTouchingPath(prs, path) {
      var want = String(path || "").replace(/^\.?\//, "");
      if (!want || !Array.isArray(prs)) return [];
      return prs.filter(function (pr) {
        return (pr.files || []).indexOf(want) !== -1;
      });
    }

    // ---------------------------------------------------------------- flag
    // Read the query string first so ?annotate=1 can turn the tool on for a
    // browser that has never had it, and ?annotate=0 can turn it off again.
    function readQueryFlag() {
      try {
        var v = new URLSearchParams(window.location.search).get("annotate");
        if (v === null) return null;
        return v === "1" || v === "true" || v === "on";
      } catch (e) {
        return null;
      }
    }

    function enabled() {
      try {
        return localStorage.getItem(FLAG_KEY) === "1";
      } catch (e) {
        return false;
      }
    }

    function setEnabled(on) {
      try {
        if (on) localStorage.setItem(FLAG_KEY, "1");
        else localStorage.removeItem(FLAG_KEY);
      } catch (e) {
        /* private mode: nothing we can do */
      }
    }

    function lsGet(k) {
      try {
        return localStorage.getItem(k);
      } catch (e) {
        return null;
      }
    }
    function lsSet(k, v) {
      try {
        localStorage.setItem(k, v);
      } catch (e) {
        /* private mode */
      }
    }

    // See OWNER vs READER. TOGGLE_SEEN_KEY is written on the first toggle
    // click, so a flag set before the toggle existed (only the owner could)
    // still counts, and one set by a reader's click does not.
    var OWNER_KEY = "blogAnnotateOwner";
    var TOGGLE_SEEN_KEY = "blogAnnotateToggleSeen";
    function owner() {
      var h = String(window.location.hostname || "").toLowerCase();
      return (
        lsGet(OWNER_KEY) === "1" ||
        (enabled() && lsGet(TOGGLE_SEEN_KEY) === null) ||
        !!lsGet(TOKEN_KEY) ||
        !!savedCockpit() ||
        h === "localhost" ||
        /\.ts\.net$/.test(h)
      );
    }

    var q = readQueryFlag();
    if (q === true) lsSet(OWNER_KEY, "1");
    if (q !== null) setEnabled(q);

    // ------------------------------------------------- saved Cockpit address
    // See SEND TO LARRY. One validator for the prompt, the fragment and every
    // read: an https origin on a tailnet name or localhost, origin only.
    function cockpitOrigin(raw) {
      var s = String(raw || "").trim();
      if (!s) return "";
      if (s.indexOf("://") < 0) s = "https://" + s;
      var u;
      try {
        u = new URL(s);
      } catch (e) {
        return "";
      }
      var h = u.hostname.toLowerCase();
      if (u.protocol !== "https:") return "";
      if (h !== "localhost" && !/\.ts\.net$/.test(h)) return "";
      return u.origin;
    }

    function savedCockpit() {
      try {
        return cockpitOrigin(localStorage.getItem(COCKPIT_KEY));
      } catch (e) {
        return "";
      }
    }

    function saveCockpit(origin) {
      try {
        localStorage.setItem(COCKPIT_KEY, origin);
      } catch (e) {
        /* private mode: used for this page load only */
      }
    }

    // #larry-cockpit=<origin> saves the address and strips itself. A fragment
    // never reaches a server log. Replacing a DIFFERENT saved address asks
    // first: anyone can own a tailnet name, so a crafted link must not
    // silently redirect the notes.
    (function readCockpitFragment() {
      var hash = String(window.location.hash || "");
      var prefix = "#larry-cockpit=";
      if (hash.indexOf(prefix) !== 0) return;
      var raw = hash.slice(prefix.length);
      try {
        raw = decodeURIComponent(raw);
      } catch (e) {
        /* keep it raw; the validator rejects junk */
      }
      try {
        history.replaceState(
          null,
          "",
          window.location.pathname + window.location.search
        );
      } catch (e) {
        /* the address is still read; the hash just stays visible */
      }
      // A reader's browser never takes an address from a link: anyone can
      // own a tailnet name, and a crafted link must not route their notes.
      if (!owner()) return;
      var origin = cockpitOrigin(raw);
      if (!origin) {
        // Fixed text, never the link's.
        if (enabled())
          window.alert("That is not a Cockpit address, so nothing was saved.");
        return;
      }
      var prev = savedCockpit();
      if (
        prev &&
        prev !== origin &&
        !window.confirm(
          "Send to Larry now posts to " + prev + ". Switch to " + origin + "?"
        )
      )
        return;
      saveCockpit(origin);
    })();

    // The keyboard toggle is the only listener a normal reader ever pays for.
    // It is a single keydown handler; cost is indistinguishable from zero.
    document.addEventListener("keydown", function (e) {
      var key = e.key || "";
      if ((e.metaKey || e.ctrlKey) && e.shiftKey && key.toLowerCase() === "a") {
        e.preventDefault();
        lsSet(OWNER_KEY, "1");
        var next = !enabled();
        setEnabled(next);
        window.location.reload();
      }
    });

    // Live on/off for the dev banner's Comments button (src/dev-info.ts):
    // no reload, so an open "Diff vs main" view survives the toggle. The UI is
    // built on first enable; turning off hides it and makes the handlers inert.
    var live = false;
    var started = false;
    var stop = null; // set by start(): closes the bubble and any open card
    window.blogAnnotate = {
      enabled: function () {
        return live;
      },
      ENTER_SAVE_MS: ENTER_SAVE_MS,
      noteEnterStep: noteEnterStep,
      prsTouchingPath: prsTouchingPath,
      cockpitOrigin: cockpitOrigin,
      set: function (on) {
        live = !!on;
        setEnabled(live);
        document.documentElement.classList.toggle("blog-annot-off", !live);
        renderBar();
        if (live && !started) {
          started = true;
          start();
        }
        if (!live && stop) stop();
      },
    };

    // ----------------------------------------------- toggle + source link
    // Shown to every reader; DOM only, no request. Kept out of the
    // .blog-annot-off rule so it stays visible when Comments are off.
    var bar = null;
    var GITHUB_SVG =
      '<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="currentColor">' +
      '<path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"></path></svg>';

    // This post's markdown on GitHub, from Jekyll's page.path.
    function sourceUrl() {
      var meta = document.getElementById("blog-annot-meta");
      var path = String((meta && meta.dataset.sourcePath) || "").replace(
        /^\.?\//,
        ""
      );
      if (!path) return "";
      return (
        "https://github.com/idvorkin/idvorkin.github.io/blob/main/" +
        path.split("/").map(encodeURIComponent).join("/")
      );
    }

    function renderBar() {
      if (!bar) return;
      var t = document.getElementById("blog-annot-toggle");
      t.setAttribute("aria-pressed", String(live));
      t.title =
        (live
          ? "Comments on: select text to comment. Click to turn off."
          : "Comments off: click to comment on this page.") +
        "\n" +
        window.location.pathname;
    }

    // The header band under (right edge, y), or null: anything fixed or
    // sticky, or a <nav>/<header> (the blog's navbar scrolls with the page).
    function headerAt(y) {
      var el = document.elementFromPoint(window.innerWidth - 24, y);
      var best = null; // the outermost band, so a nav inside a header counts as the header
      for (
        ;
        el && el !== document.body && el !== document.documentElement;
        el = el.parentElement
      ) {
        var pos = window.getComputedStyle(el).position;
        var band = el.tagName === "NAV" || el.tagName === "HEADER";
        if (pos !== "fixed" && pos !== "sticky" && !band) continue;
        var r = el.getBoundingClientRect();
        if (r.top <= y && r.bottom > y && r.bottom < window.innerHeight / 3)
          best = r;
      }
      return best;
    }

    // Top right, but under the page's own fixed headers (navbar, then the
    // dev banner below it), so the buttons never sit on a title or a link.
    function placeBar() {
      bar.style.display = "none";
      var bottom = 0;
      for (var i = 0, r; i < 3 && (r = headerAt(bottom + 16)); i++)
        bottom = r.bottom;
      bar.style.display = "";
      bar.style.top = bottom ? Math.round(bottom + 6) + "px" : "";
    }

    function mountBar() {
      if (bar || !document.body) return;
      var css = document.createElement("style");
      css.textContent = [
        "#blog-annot-bar{position:fixed;z-index:99998;display:flex;gap:6px;",
        "top:calc(8px + env(safe-area-inset-top,0px));",
        "right:calc(8px + env(safe-area-inset-right,0px));opacity:.7}",
        "#blog-annot-bar:hover,#blog-annot-bar:focus-within{opacity:1}",
        "#blog-annot-bar>*{box-sizing:border-box;width:30px;height:30px;padding:0;",
        "display:inline-flex;align-items:center;justify-content:center;",
        "border-radius:50%;border:1px solid rgba(128,128,128,.45);",
        "background:rgba(128,128,128,.18);color:inherit;cursor:pointer;",
        "font:14px/1 system-ui,sans-serif;text-decoration:none;",
        "-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}",
        "#blog-annot-toggle[aria-pressed='true']{background:#0b5ed7;",
        "border-color:#0b5ed7;box-shadow:0 0 0 2px rgba(11,94,215,.35)}",
        "@media print{#blog-annot-bar{display:none}}",
        ".navbar .blog-annot-navtoggle{background:none;border:0;padding:0;",
        "font-size:22px;line-height:1;border-radius:50%;cursor:pointer}",
        ".navbar .blog-annot-navtoggle[aria-pressed='true']{background:#0b5ed7;",
        "box-shadow:0 0 0 3px #0b5ed7}",
      ].join("");
      document.head.appendChild(css);
      // The blog's navbar already links this post's source on GitHub, so the
      // toggle joins the header right after that link. The floating bar is
      // only the fallback for a layout without it.
      var ghNav = document.querySelector(
        '.navbar a[href*="github.com/idvorkin/idvorkin.github.io/blob/"]'
      );
      if (ghNav) {
        bar = document.createElement("button");
        bar.type = "button";
        bar.id = "blog-annot-toggle";
        bar.className = "nav-fa-icon blog-annot-navtoggle";
        bar.setAttribute("aria-label", "Comments");
        bar.textContent = "💬";
        ghNav.parentNode.insertBefore(bar, ghNav.nextSibling);
        bar.onclick = toggleClick;
        renderBar();
        return;
      }
      bar = document.createElement("div");
      bar.id = "blog-annot-bar";
      var href = sourceUrl();
      bar.innerHTML =
        (href
          ? '<a id="blog-annot-src" target="_blank" rel="noopener" ' +
            'aria-label="This page on GitHub" title="This page\'s source on GitHub">' +
            GITHUB_SVG +
            "</a>"
          : "") +
        '<button type="button" id="blog-annot-toggle" aria-label="Comments">💬</button>';
      if (href) bar.firstChild.href = href;
      document.body.appendChild(bar);
      placeBar();
      window.addEventListener("resize", placeBar);
      document.getElementById("blog-annot-toggle").onclick = toggleClick;
      renderBar();
    }

    function toggleClick() {
      if (owner()) lsSet(OWNER_KEY, "1");
      lsSet(TOGGLE_SEEN_KEY, "1");
      window.blogAnnotate.set(!live);
    }
    if (document.body) mountBar();
    else document.addEventListener("DOMContentLoaded", mountBar);

    if (enabled()) window.blogAnnotate.set(true); // <-- readers stop here
    return;

    function start() {
      // --------------------------------------------------------- page identity
      var meta = document.getElementById("blog-annot-meta");
      var PERMALINK =
        (meta && meta.dataset.permalink) || window.location.pathname;
      var TITLE = (meta && meta.dataset.title) || document.title;
      // Scheme + host + port of the server actually being read. `location.host`
      // carries the port, so a non-standard preview port survives. A handful of
      // older mobile browsers ship no `location.origin`; rebuild it there.
      var ORIGIN =
        window.location.origin ||
        window.location.protocol + "//" + window.location.host;
      var SITE_URL = ((meta && meta.dataset.siteUrl) || "").replace(/\/$/, "");
      var SOURCE_PATH = (meta && meta.dataset.sourcePath) || "";
      // The Cockpit (see SEND TO LARRY): on this same host for a tailnet or
      // localhost page, else the saved address, else "" until a Send asks.
      var HOST = String(window.location.hostname || "").toLowerCase();
      var SAME_HOST = HOST === "localhost" || /\.ts\.net$/.test(HOST);
      var LARRY = SAME_HOST ? "https://" + HOST : savedCockpit();

      // ------------------------------------------------------------- storage
      function loadBuffer() {
        try {
          var raw = localStorage.getItem(BUF_KEY);
          if (!raw) return [];
          var parsed = JSON.parse(raw);
          return Array.isArray(parsed) ? parsed : [];
        } catch (e) {
          return [];
        }
      }

      function saveBuffer(list) {
        try {
          localStorage.setItem(BUF_KEY, JSON.stringify(list));
        } catch (e) {
          alert("Could not save annotation (localStorage full or blocked).");
        }
      }

      // ------------------------------------------------------------- selector
      // Build the W3C TextQuoteSelector triple: exact quote plus ~30 chars of
      // surrounding text. This is what lets the CLI find the same spot in the
      // markdown source even though the rendered HTML differs from it.
      //
      // We walk the *text* of the article container rather than the DOM so the
      // prefix/suffix cross element boundaries the way a reader perceives them.
      function articleRoot() {
        return (
          document.getElementById("content-holder") ||
          document.getElementById("main-content") ||
          document.body
        );
      }

      function selectorFromRange(range) {
        var root = articleRoot();
        var diffView = document.getElementById("rich-diff-view");
        if (
          diffView &&
          (diffView.contains(range.startContainer) ||
            diffView.contains(range.endContainer))
        ) {
          // The article is hidden behind the rendered diff. Anchor against the
          // real article text, not the diff markup (see DIFF VIEW above).
          var fn = window.blogAnnotateDiffSelector;
          return fn ? fn(range, diffView, root, CTX) : null;
        }
        var quote = range.toString();
        if (!quote.trim()) return null;

        var prefix = "";
        var suffix = "";
        try {
          var pre = range.cloneRange();
          pre.selectNodeContents(root);
          pre.setEnd(range.startContainer, range.startOffset);
          var preText = pre.toString();
          prefix = preText.slice(Math.max(0, preText.length - CTX));

          var post = range.cloneRange();
          post.selectNodeContents(root);
          post.setStart(range.endContainer, range.endOffset);
          suffix = post.toString().slice(0, CTX);
        } catch (e) {
          // Selection escaped the article root (e.g. started in the sidebar).
          // A bare quote still locates most of the time; the CLI reports the
          // ones it can't find rather than guessing.
        }

        return { quote: quote, prefix: prefix, suffix: suffix };
      }

      // ------------------------------------------------------- page versioning
      // FNV-1a, 32-bit. Not a security hash — a cheap, synchronous, stable
      // fingerprint so "did this page change since I annotated it?" is answerable
      // without refetching. crypto.subtle would work too but is async for no gain.
      function fnv1a(str) {
        var h = 0x811c9dc5;
        for (var i = 0; i < str.length; i++) {
          h ^= str.charCodeAt(i);
          h =
            (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
        }
        return ("0000000" + h.toString(16)).slice(-8);
      }

      // innerText of a display:none element is its raw textContent, so while the
      // diff view hides the article the digest would silently change. Measure it
      // as rendered: unhide for the synchronous read (no paint in between).
      function articleText(root) {
        var hidden = root.style && root.style.display === "none";
        if (hidden) root.style.display = "";
        var text = root.innerText || root.textContent || "";
        if (hidden) root.style.display = "none";
        return text;
      }

      function pageVersion() {
        var text = articleText(articleRoot()).replace(/\s+/g, " ").trim();
        return {
          url: ORIGIN + window.location.pathname,
          capturedAt: new Date().toISOString(),
          // Site deploy time, from GitHub Pages' Last-Modified header. Coarse
          // (same for every page on the site) but genuine — see the header note.
          lastModified: document.lastModified || "",
          contentLength: text.length,
          contentDigest: fnv1a(text),
        };
      }

      var composerKeys = null;

      function escapeHtml(s) {

            '"': "&quot;",

          ? rects[rects.length - 1]

        var top = r.bottom + window.scrollY + 8;
        var left = r.left + window.scrollX;
        // Keep the bubble on-screen on narrow phones.

          window.scrollX + document.documentElement.clientWidth - 130;
        btn.style.top = top + "px";
        btn.style.left =
          Math.max(window.scrollX + 8, Math.min(left, maxLeft)) + "px";

        if (!live) return hideBtn();

        "expand",

          intent = hit.getAttribute("data-intent");
          var all = chipBox.querySelectorAll("button[data-intent]");
          for (var i = 0; i < all.length; i++) {

              "aria-pressed",
              all[i] === hit ? "true" : "false"
            );
          }
          // Keep typing where the thumb left off.
          ta.focus();
        });

        function save() {
          var list = loadBuffer();
          var entry = {
            permalink: PERMALINK,
            origin: ORIGIN,
            title: TITLE,
            source: SOURCE_PATH,
            quote: sel_info.quote,
            prefix: sel_info.prefix,
            suffix: sel_info.suffix,
            comment: ta.value,
            intent: intent,
            ts: new Date().toISOString(),
            version: pageVersion(),

          list.push(entry);
          saveBuffer(list);
          refreshPill();
          hideModal();
          var s = window.getSelection();
          if (s && s.removeAllRanges) s.removeAllRanges();
        }

        document.getElementById("blog-annot-save").onclick = save;
        composerKeys = { save: save, cancel: hideModal };

        var prevText = ta.value;
        var lastEnterAt = null;
        // Composing input (phone keyboards, some dictation) is judged too: it

        ta.addEventListener("input", function () {

          var atEnd =
            ta.selectionStart === next.length &&
            ta.selectionEnd === next.length;
          var step = noteEnterStep(
            prevText,
            next,
            atEnd,
            lastEnterAt,
            Date.now()
          );
          prevText = next;
          lastEnterAt = step.lastAt;
          if (step.save) {
            ta.value = next.replace(/\s+$/, "");
            save();
          }
        });
      }

      stop = function () {

      // ---------------------------------------------------------- review flow
      var OWNER = owner();

      // Clipboard write with the execCommand fallback; resolves or rejects.
      function copyText(text) {
        function fallback() {
          var ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed";
          ta.style.opacity = "0";

          ta.select();
          var ok = false;
          try {
            ok = document.execCommand("copy");
          } catch (e) {
            ok = false;
          }
          document.body.removeChild(ta);
          return ok
            ? Promise.resolve()
            : Promise.reject(new Error("copy failed"));

        if (navigator.clipboard && navigator.clipboard.writeText)
          return navigator.clipboard.writeText(text).then(null, fallback);
        return fallback();
      }

      // The buffer as a reader pastes it to Igor: page link first, then each
      // note under its quote, one block per page.
      function readableNotes(list) {
        return reviewBatches(list)
          .map(function (batch) {
            var head =
              "Comments on " +
              batch.body.page_url +
              (batch.body.title ? " (" + batch.body.title + ")" : "");
            var lines = batch.items.map(function (a, i) {
              return (
                i +
                1 +
                ". [" +
                (a.intent || DEFAULT_INTENT) +
                '] "' +
                a.quote +
                '"' +
                (a.comment ? "\n   " + a.comment : "")
              );
            });
            return head + "\n\n" + lines.join("\n");
          })
          .join("\n\n");
      }

      document.getElementById("blog-annot-open").onclick = openReview;

      function openReview() {
        var list = loadBuffer();

          ? list
              .map(function (a, i) {

                  escapeHtml(a.intent || DEFAULT_INTENT) +
                  "] " +
                  escapeHtml(a.quote.slice(0, 90)) +
                  (a.quote.length > 90 ? "…" : "") +
                  "<br><i>" +
                  escapeHtml(a.comment || "(no comment)") +
                  "</i></li>"
                );

              .join("")

        showModal(
          "<b>Annotations (" +
            list.length +
            ")</b>" +
            '<ul id="blog-annot-list">' +

            "</ul>" +
            '<div class="row">' +
            '<button type="button" class="ghost" id="blog-annot-clear">Clear all</button>' +
            (OWNER
              ? '<button type="button" class="ghost" id="blog-annot-copy">Copy to clipboard</button>'
              : '<button type="button" class="primary" id="blog-annot-copy">Copy for Igor</button>') +
            (OWNER || lsGet(TOKEN_KEY)
              ? '<button type="button" class="primary" id="blog-annot-gist">Upload to gist</button>'
              : "") +

      // ------------------------------------------------------ send to Larry
      var LARRY_TITLES = {
        idle: "Larry: idle, ready",
        busy: "Larry: busy",
        down: "Larry: down",
        unreachable: "Larry: unreachable (not on the tailnet?)",
      };

      function setDot(state, status) {
        var dot = document.getElementById("blog-annot-larry-dot");
        if (!dot) return;
        dot.setAttribute(
          "data-state",
          state === "unreachable" ? "down" : state
        );
        var t = LARRY_TITLES[state] || "Larry: " + state;
        if (state === "busy" && status && status.queued)
          t += ", " + status.queued + " queued";
        if (state === "down" && status && status.why)
          t += " (" + status.why + ")";
        dot.title = t;
      }

      function refreshLarry() {
        if (!LARRY || !live) return Promise.resolve();
        return fetch(LARRY + "/larry/status", { cache: "no-store" })
          .then(function (res) {
            if (!res.ok) throw new Error("status " + res.status);
            return res.json();
          })
          .then(function (s) {
            setDot(s && s.state ? s.state : "down", s);
          })
          .catch(function () {
            setDot("unreachable");
          });
      }

      // One POST per page: the buffer can span pages, and each review lands on
      // its own page's thread. An id derived from the batch lets the Cockpit
      // recognize a resend whose first answer was lost.
      function reviewBatches(list) {
        var groups = {};
        var order = [];
        list.forEach(function (a) {
          var key = (a.origin || ORIGIN) + "|" + (a.permalink || PERMALINK);
          if (!groups[key]) {
            groups[key] = [];
            order.push(key);
          }
          groups[key].push(a);
        });
        return order.map(function (key) {
          var items = groups[key];
          var first = items[0];
          var path = first.permalink || PERMALINK;
          var annotations = items.map(function (a) {
            return {
              quote: a.quote || "",
              prefix: a.prefix || "",
              suffix: a.suffix || "",
              intent: a.intent || DEFAULT_INTENT,
              note: a.comment || "",
            };
          });
          return {
            items: items,
            path: path,
            body: {
              id: "blog-" + fnv1a(key + JSON.stringify(annotations)),
              permalink: SITE_URL ? SITE_URL + path : "",
              page_url: (first.origin || ORIGIN) + path,
              branch: String(window.__GIT_BRANCH__ || ""),
              title: first.title || "",
              annotations: annotations,
            },
          };
        });
      }

      function sendToLarry() {
        var list = loadBuffer();
        var sendBtn = document.getElementById("blog-annot-send");
        if (!list.length) {
          sendBtn.textContent = "Nothing to send";
          setTimeout(function () {
            sendBtn.textContent = "Send to Larry";
          }, 1500);
          return Promise.resolve();
        }
        // Off the tailnet with no saved address, ask for one once. Cancel
        // means "use the gist"; a bad address sends nothing.
        // A reader with no Larry and no token: nothing to send to, so the
        // review card with Copy for Igor.
        if (!LARRY && !OWNER && !lsGet(TOKEN_KEY)) {
          openReview();
          document.getElementById("blog-annot-note").textContent =
            "Larry isn't connected in this browser. Copy your notes and send them to Igor.";
          return Promise.resolve();
        }
        if (!LARRY && !SAME_HOST && OWNER) {
          var typed = window.prompt(
            "Cockpit address for Send to Larry (https://…), saved in this " +
              "browser. Cancel to send to a secret gist instead."
          );
          if (typed && typed.trim()) {
            var origin = cockpitOrigin(typed);
            if (!origin) {
              openReview();
              document.getElementById("blog-annot-note").textContent =
                "Not a Cockpit address, so nothing was sent. Your notes are kept.";
              return Promise.resolve();
            }
            saveCockpit(origin);
            LARRY = origin;
          }
        }
        // Gists only off the tailnet, and only once the Cockpit fails: the
        // token is asked for then, at most once per Send.
        var token = null;
        var asked = false;
        var cockpitDown = !LARRY;
        var why = "";
        function gist(batch, why) {
          if (!asked) {
            asked = true;
            token = OWNER ? getToken() : lsGet(TOKEN_KEY);
          }
          if (!token)
            return Promise.reject(
              new Error(
                (why ? why + ", and no" : "No") +
                  " GitHub token, so nothing was sent"
              )
            );
          return postGist(token, batch.path, reviewBatchJson(batch));
        }
        var deliver = SAME_HOST
          ? deliverToCockpit
          : function (batch) {
              if (cockpitDown) return gist(batch, why);
              return deliverToCockpit(batch).catch(function (err) {
                // Unreachable, CORS, timeout or an error reply: stop trying
                // the Cockpit for this Send and use the gist for the rest.
                cockpitDown = true;
                why = err.message || String(err);
                return gist(batch, why);
              });
            };
        sending = true;
        sendBtn.disabled = true;
        sendBtn.textContent = "Sending…";
        var sent = {};
        var failed = [];
        var errors = [];
        var noteKey = function (a) {
          return a.ts + "|" + a.quote;
        };
        return reviewBatches(list)
          .reduce(function (chain, batch) {
            return chain.then(function () {
              return deliver(batch)
                .then(function () {
                  batch.items.forEach(function (a) {
                    sent[noteKey(a)] = true;
                  });
                })
                .catch(function (err) {
                  failed = failed.concat(batch.items);
                  errors.push(err.message || String(err));
                });
            });
          }, Promise.resolve())
          .then(function () {
            // Only what was delivered leaves the buffer; a note saved
            // while the send was in flight stays too.
            saveBuffer(
              loadBuffer().filter(function (a) {
                return !sent[noteKey(a)];
              })
            );
            sending = false;
            refreshPill();
            sendBtn.textContent = "Send to Larry";
            refreshLarry();
            if (!failed.length) {
              sendBtn.textContent = "Sent ✓";
              setTimeout(function () {
                sendBtn.textContent = "Send to Larry";
              }, 2000);
              return;
            }
            openReview();
            document.getElementById("blog-annot-note").textContent =
              "Send to Larry failed (" +
              errors.join("; ") +
              "). Your notes are kept: upload a gist or copy them instead.";
          });
      }

      function deliverToCockpit(batch) {
        var init = {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(batch.body),
        };
        // Off the tailnet a saved address can hang instead of failing; cap
        // it so the gist fallback still runs.
        if (!SAME_HOST && window.AbortSignal && AbortSignal.timeout)
          init.signal = AbortSignal.timeout(COCKPIT_TIMEOUT_MS);
        return fetch(LARRY + "/blog-review", init).then(function (res) {
          if (!res.ok) throw new Error("Cockpit returned " + res.status);
        });
      }

      // One page's batch as the review.json a Send writes to its own gist:
      // the "Upload to gist" shape (so scripts/blog_review.py reads it as is)
      // plus the fields a watcher needs. See SEND TO LARRY above.
      function reviewBatchJson(batch) {
        var first = batch.items[0];
        var sentAt = new Date().toISOString();
        return JSON.stringify(
          {
            schema: "blog-review-batch/1",
            batch_id: batch.body.id,
            via: "send",
            permalink: batch.path,
            origin: first.origin || ORIGIN,
            title: first.title || "",
            url: batch.body.page_url,
            page_url: batch.body.page_url,
            site_url: batch.body.permalink,
            source_path: first.source || "",
            created: sentAt,
            version: first.version || null,
            annotations: batch.items,
          },
          null,
          2
        );
      }

      document.getElementById("blog-annot-send").onclick = sendToLarry;
      window.blogAnnotate.sendToLarry = sendToLarry;
      if (LARRY) {
        refreshLarry();
        setInterval(refreshLarry, 60000);
        window.blogAnnotate.refreshLarry = refreshLarry;
      }

      // ------------------------------------------------------------ open PRs
      function readPrCache() {
        try {
          var c = JSON.parse(sessionStorage.getItem(PR_CACHE_KEY) || "null");
          if (c && Array.isArray(c.prs) && Date.now() - c.at < PR_CACHE_MS)
            return c.prs;
        } catch (e) {
          /* no cache */
        }
        return null;
      }

      function writePrCache(prs) {
        try {
          sessionStorage.setItem(
            PR_CACHE_KEY,
            JSON.stringify({ at: Date.now(), prs: prs })
          );
        } catch (e) {
          /* private mode: refetch next page load */
        }
      }

      function githubJson(url) {
        return fetch(url, {
          headers: { Accept: "application/vnd.github+json" },
        }).then(function (res) {
          if (!res.ok) throw new Error("GitHub returned " + res.status);
          return res.json();
        });
      }

      // [{number, title, url, files: [repo-relative paths]}] for every open PR.
      // ponytail: first 100 PRs and first 100 files per PR only; a bigger PR
      // (an image bot) can miss a page. Upgrade: follow the Link header.
      var prsInFlight = null;
      function loadOpenPrs() {
        var cached = readPrCache();
        if (cached) return Promise.resolve(cached);
        if (prsInFlight) return prsInFlight;
        prsInFlight = githubJson(REPO_API + "/pulls?state=open&per_page=100")
          .then(function (pulls) {
            return Promise.all(
              pulls.map(function (p) {
                return githubJson(
                  REPO_API + "/pulls/" + p.number + "/files?per_page=100"
                ).then(function (files) {
                  return {
                    number: p.number,
                    title: p.title || "",
                    url: p.html_url || "",
                    files: files.map(function (f) {
                      return f.filename;
                    }),
                  };
                });
              })
            );
          })
          .then(function (prs) {
            writePrCache(prs);
            return prs;
          });
        prsInFlight.then(
          function () {
            prsInFlight = null;
          },
          function () {
            prsInFlight = null;
          }
        );
        return prsInFlight;
      }

      function showOpenPrs(prs) {
        var el = document.getElementById("blog-annot-prs");
        if (!el) return; // pill gone (page torn down) before GitHub answered
        var mine = prsTouchingPath(prs, SOURCE_PATH);
        if (!mine.length) {
          el.hidden = true;
          el.innerHTML = "";
          return;
        }
        var links = mine.map(function (pr) {
          var n = Number(pr.number);
          var href = /^https:\/\/github\.com\//.test(pr.url)
            ? pr.url
            : "https://github.com/idvorkin/idvorkin.github.io/pull/" + n;
          return (
            '<a href="' +
            escapeHtml(href) +
            '" target="_blank" rel="noopener" title="' +
            escapeHtml(pr.title) +
            '">#' +
            n +
            "</a>"
          );
        });
        el.innerHTML =
          "This page has " +
          mine.length +
          " open PR" +
          (mine.length === 1 ? "" : "s") +
          ": " +
          links.join(" ");
        el.hidden = false;
      }

      // Fails silent: a rate limit or offline page shows no badge, nothing else.
      function refreshOpenPrs() {
        if (!SOURCE_PATH || !OWNER) return Promise.resolve();
        return loadOpenPrs().then(showOpenPrs, function () {
          writePrCache([]); // don't retry on every page load while limited
        });
      }
      window.blogAnnotate.refreshOpenPrs = refreshOpenPrs;
      refreshOpenPrs();

      function payloadJson(list) {
        return JSON.stringify(
          {
            permalink: PERMALINK,
            // The batch-level origin is the server you exported from. Each
            // annotation carries its own, because the buffer can span page
            // loads — and therefore servers.
            origin: ORIGIN,
            title: TITLE,
            url: ORIGIN + window.location.pathname,
            created: new Date().toISOString(),
            // Version of the page you happen to be on when you export. Each
            // annotation carries its own `version` too — that is the one that
            // matters, since the buffer can span posts and page loads.
            version: pageVersion(),
            annotations: list,
          },
          null,
          2
        );
      }

      function getToken() {
        var t;
        try {
          t = localStorage.getItem(TOKEN_KEY);
        } catch (e) {
          t = null;
        }
        if (t) return t;
        t = window.prompt(
          "GitHub personal access token with ONLY the `gist` scope.\n" +
            "Stored in this browser's localStorage — never committed."
        );
        if (!t) return null;
        t = t.trim();
        try {
          localStorage.setItem(TOKEN_KEY, t);
        } catch (e) {
          /* still usable for this one upload */
        }
        return t;
      }

      // Create one secret gist holding `content` as review.json; resolves to
      // the gist. A rejected token is cleared so the next try re-prompts.
      function postGist(token, permalink, content) {
        var body = {
          // SECRET gist. `public: false` is the whole point — these are private
          // notes on unpublished thinking.
          public: false,
          // Larry greps for exactly this prefix. Do not reformat.
          description: "blog-review: " + permalink,
          files: { "review.json": { content: content } },
        };

        return fetch("https://api.github.com/gists", {
          method: "POST",
          headers: {
            Accept: "application/vnd.github+json",
            Authorization: "Bearer " + token,
            "Content-Type": "application/json",
          },
          body: JSON.stringify(body),
        }).then(function (res) {
          if (res.status === 401 || res.status === 403) {
            try {
              localStorage.removeItem(TOKEN_KEY);
            } catch (e) {
              /* ignore */
            }
            throw new Error(
              "GitHub rejected the token (" +
                res.status +
                "). It has been cleared — retry to re-enter one with `gist` scope."
            );
          }
          if (!res.ok) throw new Error("GitHub returned " + res.status);
          return res.json();
        });
      }

      function uploadGist(list, note) {
        var token = getToken();
        if (!token) {
          note.textContent = "No token — cancelled.";
          return;
        }
        note.textContent = "Uploading…";

        postGist(token, PERMALINK, payloadJson(list))
          .then(function (gist) {
            saveBuffer([]);
            refreshPill();
            note.innerHTML =
              "Uploaded ✅ <a href='" +
              escapeHtml(gist.html_url) +
              "' target='_blank' rel='noopener'>" +
              escapeHtml(gist.html_url) +
              "</a><br>Local buffer cleared.";
          })
          .catch(function (err) {
            // Never clear the buffer on failure — the notes are the valuable part.
            note.textContent = "Upload failed: " + err.message;
          });
      }
    }
  })();
</script>
