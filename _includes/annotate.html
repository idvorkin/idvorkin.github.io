<!--
  annotate.html — Igor's private blog annotation tool.

  INERT BY DEFAULT. Readers get no UI, no network calls, and (aside from
  this tiny script parse) no cost. Everything below is guarded by a
  localStorage flag that only Igor ever sets.

  Enable  : visit any post with ?annotate=1  (persists via localStorage)
  Disable : visit any post with ?annotate=0
  Toggle  : Cmd/Ctrl+Shift+A on desktop
  Banner  : "💬 Comments" in the local dev banner toggles it live (no reload)

  Once enabled: select text -> a small "Comment" bubble appears near the
  selection -> tap it -> type a note -> pick an intent -> Save
  (or Cmd/Ctrl+Enter; Escape cancels). Notes buffer in localStorage.
  Enter-Enter also saves, for hands-free dictation: at the END of a
  non-empty note, a second trailing newline within ENTER_SAVE_MS (400 ms) of
  the first, or one change that appends two or more trailing newlines,
  trims the trailing whitespace and saves with the selected intent. Slow
  Enters and Enters mid-text stay line breaks (see noteEnterStep).
  Double-click (or double-tap) INSIDE the selection while the bubble shows
  opens the note box for that selection, same as tapping the bubble. The
  browser collapses the selection on the first press, so the selection is
  snapshotted then; the second press within DOUBLE_PRESS_MS and
  DOUBLE_PRESS_PX (see isDoublePress) opens it and suppresses the word
  select. With no selection, a double-click on text covered by a saved,
  not-yet-sent note on this page opens that note for editing (Save replaces
  it); anywhere else a double-click keeps the browser's word select.
  The "Review (N)" pill uploads the batch to a SECRET gist (description
  `blog-review: <permalink>`) or copies it to the clipboard.

  INTENT: one tap, seven choices (fix / cut / rewrite / expand / check /
  question / note), default `note`. Phone annotation produces terse comments
  and "this is wordy" is ambiguous between cut, rewrite, and idle observation.
  One tap is the right cost; freeform per-note agent instructions are
  deliberately NOT offered, because prose turns annotating into prompt-writing.

  PAGE VERSION: recorded per annotation so a stale anchor is detectable later.
  What this site actually exposes was checked before writing this (2026-08):

    * No `last_modified_at` in any `_d/*.md` frontmatter (0 of 266).
    * `_config.yml` loads only jekyll-redirect-from + jekyll-paginate; nothing
      in _layouts/_includes references `site.github.*`, so there is NO
      `site.github.build_revision` and no git SHA in the built page.
    * The served HTML carries no generator / revision / version meta tag.
    * GitHub Pages DOES send a real `Last-Modified` header, which the browser
      surfaces as `document.lastModified` — but it is the SITE DEPLOY time,
      byte-identical across every page (verified: /timeoff-2026-07, /22 and
      /40yo all returned the same value). It identifies the build, not the post.

  So the marker below is: the deploy stamp (real, coarse) plus a length and an
  FNV-1a digest of the rendered article text (exact, per-post, derived from the
  bytes actually annotated). blog_review.py adds the per-post signal git
  already knows: whether the markdown was committed after the note was written.

  ORIGIN: recorded next to every `permalink`, at both the batch and the
  annotation level. `permalink` alone cannot tell you WHICH server you were
  reading — a note taken against the local Jekyll preview and one taken
  against the live site are byte-identical without it. `location.origin` is
  scheme + host + port, so `https://idvork.in` and
  `http://c-5004.squeaker-teeth.ts.net:4000` are distinguishable.

  `location.href` is deliberately NOT recorded: beyond origin + permalink it
  only adds the query string and fragment, which here means `?annotate=1` and
  whatever heading you last clicked — tool state, not page identity.

  SECURITY: the GitHub PAT lives ONLY in this browser's localStorage under
  `blogAnnotateToken`. It is never committed, never sent anywhere except
  api.github.com. Use a fine-grained/classic token with the `gist` scope
  ONLY — nothing else.

  DIFF VIEW: the dev banner's "Diff vs main" (src/rich-diff.ts) hides the
  article and shows a rendered diff in its place. A selection there is handed
  to src/annotate-anchor.ts (window.blogAnnotateDiffSelector, registered by
  the diff), which drops struck-out text and re-anchors the quote against the
  real article, so the note is the one you'd get selecting on the page. It
  adds `diff: {inserted: all|some|none, anchoredTo: page|diff-view}`. The page
  version is always measured on the real article, never the diff DOM.

  Larry reads the batches back with scripts/blog_review.py.

  SEND TO LARRY: only when the page itself is served on a tailnet host
  (`location.hostname` ends in `.ts.net`) or localhost, the pill also gets a
  status dot and a "Send to Larry" button. Both talk to the Cockpit on the
  SAME hostname over https at the default port (`/larry/status`,
  `/blog-review`); no host is written here. The dot is green when Larry is
  idle, amber when busy, red when down or unreachable (off the tailnet).
  Send posts one batch per page and clears only what the Cockpit accepted
  (2xx); on any failure the buffer stays and the review card opens with the
  gist/clipboard fallback. Production (idvork.in) gets none of this: no
  button, no dot, no request.
-->

<!--
  Page identity is passed through data attributes rather than interpolated
  into the <script> body: Liquid tags inside JS are not valid JS, and the
  repo's prettier hook parses script contents.
-->
<div
  id="blog-annot-meta"
  data-permalink="{{ page.url }}"
  data-title="{{ page.title | default: '' | escape }}"
  data-site-url="{{ site.url }}"
  hidden
></div>

<script>
  (function () {
    "use strict";

    var FLAG_KEY = "blogAnnotate";
    var TOKEN_KEY = "blogAnnotateToken";
    var BUF_KEY = "blogAnnotateBuffer";
    var CTX = 30; // chars of prefix/suffix context (W3C TextQuoteSelector)
    var ENTER_SAVE_MS = 400; // two trailing Enters this close together save the note
    var DOUBLE_PRESS_MS = 500; // two presses this close in time and space are a double-click
    var DOUBLE_PRESS_PX = 24;

    // Is `press` ({t, x, y}) the second half of a double-click or double-tap
    // begun by `prev` (the previous press, or null)? Decided by hand rather
    // than from the `dblclick` event because a double-tap on a phone fires
    // none, and by then the browser has replaced the selection with a word.
    function isDoublePress(prev, press) {
      if (!prev) return false;
      var dx = press.x - prev.x;
      var dy = press.y - prev.y;
      return (
        press.t - prev.t >= 0 &&
        press.t - prev.t <= DOUBLE_PRESS_MS &&
        dx * dx + dy * dy <= DOUBLE_PRESS_PX * DOUBLE_PRESS_PX
      );
    }

    // Enter-Enter save rule, decided from the textarea's value before and
    // after one input event (not keydown: dictation and phone keyboards
    // often send no usable Enter key). `lastAt` is when the previous event
    // appended a lone trailing newline, or null. A change counts only when
    // it appends to the old value with the caret at the end; its trailing
    // whitespace run gives the number of Enters it added.
    function noteEnterStep(prev, next, caretAtEnd, lastAt, now) {
      if (!caretAtEnd || next.slice(0, prev.length) !== prev) {
        return { save: false, lastAt: null };
      }
      var tail = /\s*$/.exec(next.slice(prev.length))[0];
      var enters = tail.split("\n").length - 1;
      var hasText = next.trim() !== "";
      if (enters >= 2) return { save: hasText, lastAt: null };
      if (enters === 0) return { save: false, lastAt: null };
      if (hasText && lastAt !== null && now - lastAt <= ENTER_SAVE_MS) {
        return { save: true, lastAt: null };
      }
      return { save: false, lastAt: now };
    }

    // ---------------------------------------------------------------- flag
    // Read the query string first so ?annotate=1 can turn the tool on for a
    // browser that has never had it, and ?annotate=0 can turn it off again.
    function readQueryFlag() {
      try {
        var v = new URLSearchParams(window.location.search).get("annotate");
        if (v === null) return null;
        return v === "1" || v === "true" || v === "on";
      } catch (e) {
        return null;
      }
    }

    function enabled() {
      try {
        return localStorage.getItem(FLAG_KEY) === "1";
      } catch (e) {
        return false;
      }
    }

    function setEnabled(on) {
      try {
        if (on) localStorage.setItem(FLAG_KEY, "1");
        else localStorage.removeItem(FLAG_KEY);
      } catch (e) {
        /* private mode: nothing we can do */
      }
    }

    var q = readQueryFlag();
    if (q !== null) setEnabled(q);

    // The keyboard toggle is the only listener a normal reader ever pays for.
    // It is a single keydown handler; cost is indistinguishable from zero.
    document.addEventListener("keydown", function (e) {
      var key = e.key || "";
      if ((e.metaKey || e.ctrlKey) && e.shiftKey && key.toLowerCase() === "a") {
        e.preventDefault();
        var next = !enabled();
        setEnabled(next);
        window.location.reload();
      }
    });

    // Live on/off for the dev banner's Comments button (src/dev-info.ts):
    // no reload, so an open "Diff vs main" view survives the toggle. The UI is
    // built on first enable; turning off hides it and makes the handlers inert.
    var live = false;
    var started = false;
    var stop = null; // set by start(): closes the bubble and any open card
    window.blogAnnotate = {
      enabled: function () {
        return live;
      },
      ENTER_SAVE_MS: ENTER_SAVE_MS,
      noteEnterStep: noteEnterStep,
      DOUBLE_PRESS_MS: DOUBLE_PRESS_MS,
      DOUBLE_PRESS_PX: DOUBLE_PRESS_PX,
      isDoublePress: isDoublePress,
      set: function (on) {
        live = !!on;
        setEnabled(live);
        document.documentElement.classList.toggle("blog-annot-off", !live);
        if (live && !started) {
          started = true;
          start();
        }
        if (!live && stop) stop();
      },
    };

    if (enabled()) window.blogAnnotate.set(true); // <-- readers stop here
    return;

    function start() {
      // --------------------------------------------------------- page identity
      var meta = document.getElementById("blog-annot-meta");
      var PERMALINK =
        (meta && meta.dataset.permalink) || window.location.pathname;
      var TITLE = (meta && meta.dataset.title) || document.title;
      // Scheme + host + port of the server actually being read. `location.host`
      // carries the port, so a non-standard preview port survives. A handful of
      // older mobile browsers ship no `location.origin`; rebuild it there.
      var ORIGIN =
        window.location.origin ||
        window.location.protocol + "//" + window.location.host;
      var SITE_URL = ((meta && meta.dataset.siteUrl) || "").replace(/\/$/, "");
      // The Cockpit on this same host (see SEND TO LARRY), or "" off-tailnet.
      var HOST = String(window.location.hostname || "").toLowerCase();
      var LARRY =
        HOST === "localhost" || /\.ts\.net$/.test(HOST)
          ? "https://" + HOST
          : "";

      // ------------------------------------------------------------- storage
      function loadBuffer() {
        try {
          var raw = localStorage.getItem(BUF_KEY);
          if (!raw) return [];
          var parsed = JSON.parse(raw);
          return Array.isArray(parsed) ? parsed : [];
        } catch (e) {
          return [];
        }
      }

      function saveBuffer(list) {
        try {
          localStorage.setItem(BUF_KEY, JSON.stringify(list));
        } catch (e) {
          alert("Could not save annotation (localStorage full or blocked).");
        }
      }

      // ------------------------------------------------------------- selector
      // Build the W3C TextQuoteSelector triple: exact quote plus ~30 chars of
      // surrounding text. This is what lets the CLI find the same spot in the
      // markdown source even though the rendered HTML differs from it.
      //
      // We walk the *text* of the article container rather than the DOM so the
      // prefix/suffix cross element boundaries the way a reader perceives them.
      function articleRoot() {
        return (
          document.getElementById("content-holder") ||
          document.getElementById("main-content") ||
          document.body
        );
      }

      function selectorFromRange(range) {
        var root = articleRoot();
        var diffView = document.getElementById("rich-diff-view");
        if (
          diffView &&
          (diffView.contains(range.startContainer) ||
            diffView.contains(range.endContainer))
        ) {
          // The article is hidden behind the rendered diff. Anchor against the
          // real article text, not the diff markup (see DIFF VIEW above).
          var fn = window.blogAnnotateDiffSelector;
          return fn ? fn(range, diffView, root, CTX) : null;
        }
        var quote = range.toString();
        if (!quote.trim()) return null;

        var prefix = "";
        var suffix = "";
        try {
          var pre = range.cloneRange();
          pre.selectNodeContents(root);
          pre.setEnd(range.startContainer, range.startOffset);
          var preText = pre.toString();
          prefix = preText.slice(Math.max(0, preText.length - CTX));

          var post = range.cloneRange();
          post.selectNodeContents(root);
          post.setStart(range.endContainer, range.endOffset);
          suffix = post.toString().slice(0, CTX);
        } catch (e) {
          // Selection escaped the article root (e.g. started in the sidebar).
          // A bare quote still locates most of the time; the CLI reports the
          // ones it can't find rather than guessing.
        }

        return { quote: quote, prefix: prefix, suffix: suffix };
      }

      // ------------------------------------------------------- page versioning
      // FNV-1a, 32-bit. Not a security hash — a cheap, synchronous, stable
      // fingerprint so "did this page change since I annotated it?" is answerable
      // without refetching. crypto.subtle would work too but is async for no gain.
      function fnv1a(str) {
        var h = 0x811c9dc5;
        for (var i = 0; i < str.length; i++) {
          h ^= str.charCodeAt(i);
          h =
            (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
        }
        return ("0000000" + h.toString(16)).slice(-8);
      }

      // innerText of a display:none element is its raw textContent, so while the
      // diff view hides the article the digest would silently change. Measure it
      // as rendered: unhide for the synchronous read (no paint in between).
      function articleText(root) {
        var hidden = root.style && root.style.display === "none";
        if (hidden) root.style.display = "";
        var text = root.innerText || root.textContent || "";
        if (hidden) root.style.display = "none";
        return text;
      }

      function pageVersion() {
        var text = articleText(articleRoot()).replace(/\s+/g, " ").trim();
        return {
          url: ORIGIN + window.location.pathname,
          capturedAt: new Date().toISOString(),
          // Site deploy time, from GitHub Pages' Last-Modified header. Coarse
          // (same for every page on the site) but genuine — see the header note.
          lastModified: document.lastModified || "",
          contentLength: text.length,
          contentDigest: fnv1a(text),
        };
      }

      // ------------------------------------------------------------------ UI
      var style = document.createElement("style");
      style.textContent = [
        "#blog-annot-btn{position:absolute;z-index:99999;display:none;",
        "padding:6px 12px;font:600 14px/1.2 system-ui,sans-serif;color:#fff;",
        "background:#0b5ed7;border:0;border-radius:16px;cursor:pointer;",
        "box-shadow:0 2px 8px rgba(0,0,0,.3);touch-action:manipulation}",
        "#blog-annot-pill{position:fixed;right:14px;bottom:14px;z-index:99999;",
        "display:flex;gap:6px;align-items:center;padding:8px 12px;",
        "font:600 13px/1.2 system-ui,sans-serif;color:#fff;background:#212529;",
        "border-radius:20px;box-shadow:0 2px 10px rgba(0,0,0,.35)}",
        // Sit above the rich diff's change navigator (#rd-nav) instead of over it.
        "body:has(#rd-nav) #blog-annot-pill{bottom:70px}",
        "#blog-annot-pill button{font:600 12px/1.2 system-ui,sans-serif;",
        "padding:5px 9px;border:0;border-radius:12px;cursor:pointer;",
        "background:#495057;color:#fff}",
        "#blog-annot-pill button:disabled{opacity:.45;cursor:default}",
        "#blog-annot-larry-dot{width:10px;height:10px;border-radius:50%;",
        "background:#868e96;display:inline-block}",
        "#blog-annot-larry-dot[data-state='idle']{background:#2f9e44}",
        "#blog-annot-larry-dot[data-state='busy']{background:#f59f00}",
        "#blog-annot-larry-dot[data-state='down']{background:#e03131}",
        "#blog-annot-modal{position:fixed;inset:0;z-index:100000;display:none;",
        "align-items:center;justify-content:center;background:rgba(0,0,0,.45);",
        "padding:16px}",
        "#blog-annot-card{width:100%;max-width:520px;background:#fff;color:#111;",
        "border-radius:12px;padding:16px;font:14px/1.45 system-ui,sans-serif;",
        "max-height:85vh;overflow:auto}",
        "#blog-annot-card blockquote{margin:0 0 10px;padding:8px 10px;",
        "background:#f1f3f5;border-left:3px solid #0b5ed7;font-style:italic;",
        "max-height:9em;overflow:auto}",
        "#blog-annot-card textarea{width:100%;min-height:110px;padding:8px;",
        "font:14px/1.4 system-ui,sans-serif;border:1px solid #ced4da;",
        "border-radius:8px;box-sizing:border-box}",
        "#blog-annot-intents{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}",
        "#blog-annot-intents button{padding:7px 12px;border:1px solid #ced4da;",
        "border-radius:14px;background:#f8f9fa;color:#495057;",
        "font:600 13px/1.2 system-ui,sans-serif;cursor:pointer;",
        "touch-action:manipulation}",
        "#blog-annot-intents button[aria-pressed='true']{background:#0b5ed7;",
        "border-color:#0b5ed7;color:#fff}",
        "#blog-annot-card .row{display:flex;gap:8px;justify-content:flex-end;",
        "margin-top:10px;flex-wrap:wrap;align-items:center}",
        "#blog-annot-card .hint{margin-right:auto;font-size:12px;color:#868e96}",
        "#blog-annot-card button{padding:8px 14px;border:0;border-radius:8px;",
        "font:600 13px/1.2 system-ui,sans-serif;cursor:pointer}",
        "#blog-annot-card .primary{background:#0b5ed7;color:#fff}",
        "#blog-annot-card .ghost{background:#e9ecef;color:#212529}",
        "#blog-annot-list{margin:10px 0 0;padding:0;list-style:none;",
        "font-size:13px}",
        "#blog-annot-list li{padding:6px 0;border-top:1px solid #e9ecef}",
        "#blog-annot-note{margin-top:10px;font-size:12px;color:#495057;",
        "word-break:break-all}",
        ".blog-annot-off #blog-annot-btn,.blog-annot-off #blog-annot-pill,",
        ".blog-annot-off #blog-annot-modal{display:none!important}",
      ].join("");
      document.head.appendChild(style);

      var btn = document.createElement("button");
      btn.id = "blog-annot-btn";
      btn.type = "button";
      btn.textContent = "💬 Comment";
      document.body.appendChild(btn);

      var pill = document.createElement("div");
      pill.id = "blog-annot-pill";
      pill.innerHTML =
        '<span id="blog-annot-count">Review (0)</span>' +
        '<button type="button" id="blog-annot-open">Open</button>' +
        (LARRY
          ? '<span id="blog-annot-larry-dot" data-state="unknown" title="Larry: checking…"></span>' +
            '<button type="button" id="blog-annot-send">Send to Larry</button>'
          : "");
      document.body.appendChild(pill);

      var modal = document.createElement("div");
      modal.id = "blog-annot-modal";
      modal.innerHTML = '<div id="blog-annot-card"></div>';
      document.body.appendChild(modal);
      var card = modal.firstChild;

      function showModal(html) {
        card.innerHTML = html;
        modal.style.display = "flex";
      }
      function hideModal() {
        modal.style.display = "none";
        card.innerHTML = "";
        composerKeys = null;
      }
      // Close on a backdrop click only when the press also began on the
      // backdrop: the double-click that opens the composer ends with its
      // release (and a phone's synthetic click) landing on the fresh backdrop.
      var backdropPress = false;
      modal.addEventListener("pointerdown", function (e) {
        backdropPress = e.target === modal;
      });
      modal.addEventListener("click", function (e) {
        if (e.target === modal && backdropPress) hideModal();
        backdropPress = false;
      });
      function modalOpen() {
        return modal.style.display === "flex";
      }

      // Keyboard submit/cancel for the composer. Registered once on document so
      // it fires no matter which control has focus (textarea, an intent chip, or
      // nothing); `composerKeys` is non-null only while the composer is open, so
      // this is inert the rest of the time.
      var composerKeys = null;
      var IS_MAC = /Mac|iPhone|iPad|iPod/.test(navigator.platform || "");
      document.addEventListener("keydown", function (e) {
        if (!composerKeys) return;
        if (e.key === "Escape" || e.key === "Esc") {
          e.preventDefault();
          composerKeys.cancel();
          return;
        }
        var isEnter = e.key === "Enter" || e.keyCode === 13;
        // Cmd+Enter on mac, Ctrl+Enter elsewhere. Accept either on both — a
        // Bluetooth keyboard on an iPad can report whichever it likes.
        if (isEnter && (e.metaKey || e.ctrlKey)) {
          e.preventDefault();
          composerKeys.save();
        }
      });

      function refreshPill() {
        document.getElementById("blog-annot-count").textContent =
          "Review (" + loadBuffer().length + ")";
      }
      refreshPill();

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;",
          }[c];
        });
      }

      // --------------------------------------------------------- capture flow
      var pending = null;

      function hideBtn() {
        btn.style.display = "none";
      }

      function positionBtn(range) {
        var rects = range.getClientRects();
        var r = rects.length
          ? rects[rects.length - 1]
          : range.getBoundingClientRect();
        if (!r || (!r.width && !r.height)) return hideBtn();
        var top = r.bottom + window.scrollY + 8;
        var left = r.left + window.scrollX;
        // Keep the bubble on-screen on narrow phones.
        var maxLeft =
          window.scrollX + document.documentElement.clientWidth - 130;
        btn.style.top = top + "px";
        btn.style.left =
          Math.max(window.scrollX + 8, Math.min(left, maxLeft)) + "px";
        btn.style.display = "block";
      }

      function onSelectionSettled() {
        if (!live || modalOpen()) return hideBtn();
        var sel = window.getSelection();
        if (!sel || sel.isCollapsed || sel.rangeCount === 0) return hideBtn();
        var range = sel.getRangeAt(0);
        if (!range.toString().trim()) return hideBtn();
        var sel_info = selectorFromRange(range);
        if (!sel_info) return hideBtn();
        pending = sel_info;
        positionBtn(range);
      }

      // mouseup covers desktop; selectionchange (debounced) covers iOS Safari
      // touch selection, where mouseup fires unreliably and the handles keep
      // moving after the initial gesture.
      document.addEventListener("mouseup", function () {
        setTimeout(onSelectionSettled, 10);
      });

      var selTimer = null;
      document.addEventListener("selectionchange", function () {
        if (selTimer) clearTimeout(selTimer);
        selTimer = setTimeout(onSelectionSettled, 350);
      });

      // Both, so a tap on the bubble registers immediately on iOS instead of
      // waiting out the 300ms click delay (and losing the selection first).
      ["click", "touchend"].forEach(function (evt) {
        btn.addEventListener(evt, function (e) {
          e.preventDefault();
          e.stopPropagation();
          if (pending) openComposer(pending);
        });
      });

      // ------------------------------------------------- double-click to note
      function pointInSelection(x, y) {
        var sel = window.getSelection();
        if (!sel || sel.isCollapsed || sel.rangeCount === 0) return false;
        var rects = sel.getRangeAt(0).getClientRects();
        for (var i = 0; i < rects.length; i++) {
          var r = rects[i];
          if (
            x >= r.left - 4 &&
            x <= r.right + 4 &&
            y >= r.top - 4 &&
            y <= r.bottom + 4
          )
            return true;
        }
        return false;
      }

      function caretAt(x, y) {
        if (document.caretPositionFromPoint) {
          var p = document.caretPositionFromPoint(x, y);
          return p ? { node: p.offsetNode, offset: p.offset } : null;
        }
        if (document.caretRangeFromPoint) {
          var r = document.caretRangeFromPoint(x, y);
          return r ? { node: r.startContainer, offset: r.startOffset } : null;
        }
        return null;
      }

      // The newest buffered note on this page whose quote covers the point,
      // located the way selectorFromRange measured it: prefix + quote in the
      // Range text of the article root. Not offered in the diff view.
      function savedNoteAt(x, y) {
        var root = articleRoot();
        var diffView = document.getElementById("rich-diff-view");
        var caret = caretAt(x, y);
        if (!caret || !root.contains(caret.node)) return null;
        if (diffView && diffView.contains(caret.node)) return null;
        var whole = document.createRange();
        whole.selectNodeContents(root);
        var text = whole.toString();
        var upTo = document.createRange();
        upTo.selectNodeContents(root);
        try {
          upTo.setEnd(caret.node, caret.offset);
        } catch (e) {
          return null;
        }
        var at = upTo.toString().length;
        var list = loadBuffer();
        for (var i = list.length - 1; i >= 0; i--) {
          var a = list[i];
          if ((a.permalink || PERMALINK) !== PERMALINK) continue;
          if ((a.origin || ORIGIN) !== ORIGIN || !a.quote) continue;
          var idx = text.indexOf((a.prefix || "") + a.quote);
          if (idx < 0) continue;
          var from = idx + (a.prefix || "").length;
          if (at >= from && at < from + a.quote.length) return a;
        }
        return null;
      }

      function ownUi(node) {
        return (
          btn.contains(node) || pill.contains(node) || modal.contains(node)
        );
      }

      var lastPress = null;
      document.addEventListener(
        "pointerdown",
        function (e) {
          if (!live || modalOpen() || ownUi(e.target) || e.button > 0) {
            lastPress = null;
            return;
          }
          var press = { t: Date.now(), x: e.clientX, y: e.clientY, sel: null };
          if (isDoublePress(lastPress, press)) {
            var snap = lastPress.sel;
            lastPress = null;
            var saved = snap ? null : savedNoteAt(press.x, press.y);
            if (!snap && !saved) return;
            e.preventDefault();
            if (snap) openComposer(snap);
            else openComposer(saved, saved);
            return;
          }
          if (btn.style.display === "block" && pending) {
            if (pointInSelection(press.x, press.y)) press.sel = pending;
          }
          lastPress = press;
        },
        true
      );
      // The second press's mousedown would select a word behind the composer
      // and pull focus off the note box.
      document.addEventListener(
        "mousedown",
        function (e) {
          if (live && modalOpen() && !card.contains(e.target))
            e.preventDefault();
        },
        true
      );

      // One tap, seven choices. Keep in sync with INTENTS in scripts/blog_review.py.
      var INTENTS = [
        "fix",
        "cut",
        "rewrite",
        "expand",
        "check",
        "question",
        "note",
      ];
      var DEFAULT_INTENT = "note";

      // `editing` is a buffered note to replace on Save, or undefined for a
      // new one; `sel_info` then is that note (quote, prefix, suffix, diff).
      function openComposer(sel_info, editing) {
        hideBtn();
        var intent =
          editing && INTENTS.indexOf(editing.intent) >= 0
            ? editing.intent
            : DEFAULT_INTENT;
        var chips = INTENTS.map(function (name) {
          return (
            '<button type="button" data-intent="' +
            name +
            '" aria-pressed="' +
            (name === intent ? "true" : "false") +
            '">' +
            name +
            "</button>"
          );
        }).join("");

        showModal(
          "<blockquote>" +
            escapeHtml(sel_info.quote) +
            "</blockquote>" +
            '<textarea id="blog-annot-text" placeholder="What about this line?"></textarea>' +
            '<div id="blog-annot-intents">' +
            chips +
            "</div>" +
            '<div class="row">' +
            '<span class="hint">' +
            (editing ? "Editing saved note · " : "") +
            (IS_MAC ? "⌘" : "Ctrl") +
            "+Enter or Enter twice saves · Esc cancels</span>" +
            '<button type="button" class="ghost" id="blog-annot-cancel">Cancel</button>' +
            '<button type="button" class="primary" id="blog-annot-save">Save</button>' +
            "</div>"
        );

        var ta = document.getElementById("blog-annot-text");
        if (editing) ta.value = editing.comment || "";
        ta.focus();
        ta.setSelectionRange(ta.value.length, ta.value.length);

        var chipBox = document.getElementById("blog-annot-intents");
        chipBox.addEventListener("click", function (e) {
          var hit = e.target.closest
            ? e.target.closest("button[data-intent]")
            : null;
          if (!hit) return;
          e.preventDefault();
          intent = hit.getAttribute("data-intent");
          var all = chipBox.querySelectorAll("button[data-intent]");
          for (var i = 0; i < all.length; i++) {
            all[i].setAttribute(
              "aria-pressed",
              all[i] === hit ? "true" : "false"
            );
          }
          // Keep typing where the thumb left off.
          ta.focus();
        });

        function save() {
          var list = loadBuffer();
          var entry = {
            permalink: PERMALINK,
            origin: ORIGIN,
            title: TITLE,
            quote: sel_info.quote,
            prefix: sel_info.prefix,
            suffix: sel_info.suffix,
            comment: ta.value,
            intent: intent,
            ts: new Date().toISOString(),
            version: pageVersion(),
          };
          if (sel_info.diff) entry.diff = sel_info.diff;
          // An edit replaces its note in place. The fresh ts matters: a send
          // in flight clears by ts|quote, so it must not clear the edit.
          var at = -1;
          for (var i = 0; editing && i < list.length; i++) {
            if (list[i].ts === editing.ts && list[i].quote === editing.quote)
              at = i;
          }
          if (at >= 0) list[at] = entry;
          else list.push(entry);
          saveBuffer(list);
          refreshPill();
          hideModal();
          var s = window.getSelection();
          if (s && s.removeAllRanges) s.removeAllRanges();
        }

        document.getElementById("blog-annot-cancel").onclick = hideModal;
        document.getElementById("blog-annot-save").onclick = save;
        composerKeys = { save: save, cancel: hideModal };

        var prevText = ta.value;
        var lastEnterAt = null;
        // Composing input (phone keyboards, some dictation) is judged too: it
        // can only trigger a save by appending trailing newlines.
        ta.addEventListener("input", function () {
          var next = ta.value;
          var atEnd =
            ta.selectionStart === next.length &&
            ta.selectionEnd === next.length;
          var step = noteEnterStep(
            prevText,
            next,
            atEnd,
            lastEnterAt,
            Date.now()
          );
          prevText = next;
          lastEnterAt = step.lastAt;
          if (step.save) {
            ta.value = next.replace(/\s+$/, "");
            save();
          }
        });
      }

      stop = function () {
        hideBtn();
        hideModal();
      };

      // ---------------------------------------------------------- review flow
      document.getElementById("blog-annot-open").onclick = openReview;

      function openReview() {
        var list = loadBuffer();
        var items = list.length
          ? list
              .map(function (a, i) {
                return (
                  "<li><b>" +
                  (i + 1) +
                  ".</b> [" +
                  escapeHtml(a.intent || DEFAULT_INTENT) +
                  "] " +
                  escapeHtml(a.quote.slice(0, 90)) +
                  (a.quote.length > 90 ? "…" : "") +
                  "<br><i>" +
                  escapeHtml(a.comment || "(no comment)") +
                  "</i></li>"
                );
              })
              .join("")
          : "<li>Nothing captured yet.</li>";

        showModal(
          "<b>Annotations (" +
            list.length +
            ")</b>" +
            '<ul id="blog-annot-list">' +
            items +
            "</ul>" +
            '<div class="row">' +
            '<button type="button" class="ghost" id="blog-annot-clear">Clear all</button>' +
            '<button type="button" class="ghost" id="blog-annot-copy">Copy to clipboard</button>' +
            '<button type="button" class="primary" id="blog-annot-gist">Upload to gist</button>' +
            '<button type="button" class="ghost" id="blog-annot-close">Close</button>' +
            "</div>" +
            '<div id="blog-annot-note"></div>'
        );

        var note = document.getElementById("blog-annot-note");
        document.getElementById("blog-annot-close").onclick = hideModal;

        document.getElementById("blog-annot-clear").onclick = function () {
          if (!confirm("Discard all " + list.length + " annotations?")) return;
          saveBuffer([]);
          refreshPill();
          hideModal();
        };

        document.getElementById("blog-annot-copy").onclick = function () {
          var json = payloadJson(list);
          function fallback() {
            var ta = document.createElement("textarea");
            ta.value = json;
            ta.style.position = "fixed";
            ta.style.opacity = "0";
            document.body.appendChild(ta);
            ta.select();
            try {
              document.execCommand("copy");
              note.textContent = "Copied " + list.length + " annotations.";
            } catch (e) {
              note.textContent = "Copy failed — select the JSON manually.";
            }
            document.body.removeChild(ta);
          }
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(json).then(function () {
              note.textContent = "Copied " + list.length + " annotations.";
            }, fallback);
          } else {
            fallback();
          }
        };

        document.getElementById("blog-annot-gist").onclick = function () {
          if (!list.length) {
            note.textContent = "Nothing to upload.";
            return;
          }
          uploadGist(list, note);
        };
      }

      // ------------------------------------------------------ send to Larry
      var LARRY_TITLES = {
        idle: "Larry: idle, ready",
        busy: "Larry: busy",
        down: "Larry: down",
        unreachable: "Larry: unreachable (not on the tailnet?)",
      };

      function setDot(state, status) {
        var dot = document.getElementById("blog-annot-larry-dot");
        if (!dot) return;
        dot.setAttribute(
          "data-state",
          state === "unreachable" ? "down" : state
        );
        var t = LARRY_TITLES[state] || "Larry: " + state;
        if (state === "busy" && status && status.queued)
          t += ", " + status.queued + " queued";
        if (state === "down" && status && status.why)
          t += " (" + status.why + ")";
        dot.title = t;
      }

      function refreshLarry() {
        if (!LARRY || !live) return Promise.resolve();
        return fetch(LARRY + "/larry/status", { cache: "no-store" })
          .then(function (res) {
            if (!res.ok) throw new Error("status " + res.status);
            return res.json();
          })
          .then(function (s) {
            setDot(s && s.state ? s.state : "down", s);
          })
          .catch(function () {
            setDot("unreachable");
          });
      }

      // One POST per page: the buffer can span pages, and each review lands on
      // its own page's thread. An id derived from the batch lets the Cockpit
      // recognize a resend whose first answer was lost.
      function reviewBatches(list) {
        var groups = {};
        var order = [];
        list.forEach(function (a) {
          var key = (a.origin || ORIGIN) + "|" + (a.permalink || PERMALINK);
          if (!groups[key]) {
            groups[key] = [];
            order.push(key);
          }
          groups[key].push(a);
        });
        return order.map(function (key) {
          var items = groups[key];
          var first = items[0];
          var path = first.permalink || PERMALINK;
          var annotations = items.map(function (a) {
            return {
              quote: a.quote || "",
              prefix: a.prefix || "",
              suffix: a.suffix || "",
              intent: a.intent || DEFAULT_INTENT,
              note: a.comment || "",
            };
          });
          return {
            items: items,
            body: {
              id: "blog-" + fnv1a(key + JSON.stringify(annotations)),
              permalink: SITE_URL ? SITE_URL + path : "",
              page_url: (first.origin || ORIGIN) + path,
              branch: String(window.__GIT_BRANCH__ || ""),
              title: first.title || "",
              annotations: annotations,
            },
          };
        });
      }

      function sendToLarry() {
        var list = loadBuffer();
        var sendBtn = document.getElementById("blog-annot-send");
        if (!list.length) {
          sendBtn.textContent = "Nothing to send";
          setTimeout(function () {
            sendBtn.textContent = "Send to Larry";
          }, 1500);
          return Promise.resolve();
        }
        sendBtn.disabled = true;
        sendBtn.textContent = "Sending…";
        var sent = {};
        var failed = [];
        var errors = [];
        var noteKey = function (a) {
          return a.ts + "|" + a.quote;
        };
        return reviewBatches(list)
          .reduce(function (chain, batch) {
            return chain.then(function () {
              return fetch(LARRY + "/blog-review", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(batch.body),
              })
                .then(function (res) {
                  if (!res.ok)
                    throw new Error("Cockpit returned " + res.status);
                  batch.items.forEach(function (a) {
                    sent[noteKey(a)] = true;
                  });
                })
                .catch(function (err) {
                  failed = failed.concat(batch.items);
                  errors.push(err.message || String(err));
                });
            });
          }, Promise.resolve())
          .then(function () {
            // Only what the Cockpit accepted leaves the buffer; a note saved
            // while the send was in flight stays too.
            saveBuffer(
              loadBuffer().filter(function (a) {
                return !sent[noteKey(a)];
              })
            );
            refreshPill();
            sendBtn.disabled = false;
            sendBtn.textContent = "Send to Larry";
            refreshLarry();
            if (!failed.length) {
              sendBtn.textContent = "Sent ✓";
              setTimeout(function () {
                sendBtn.textContent = "Send to Larry";
              }, 2000);
              return;
            }
            openReview();
            document.getElementById("blog-annot-note").textContent =
              "Send to Larry failed (" +
              errors.join("; ") +
              "). Your notes are kept: upload a gist or copy them instead.";
          });
      }

      if (LARRY) {
        document.getElementById("blog-annot-send").onclick = sendToLarry;
        refreshLarry();
        setInterval(refreshLarry, 60000);
        window.blogAnnotate.sendToLarry = sendToLarry;
        window.blogAnnotate.refreshLarry = refreshLarry;
      }

      function payloadJson(list) {
        return JSON.stringify(
          {
            permalink: PERMALINK,
            // The batch-level origin is the server you exported from. Each
            // annotation carries its own, because the buffer can span page
            // loads — and therefore servers.
            origin: ORIGIN,
            title: TITLE,
            url: ORIGIN + window.location.pathname,
            created: new Date().toISOString(),
            // Version of the page you happen to be on when you export. Each
            // annotation carries its own `version` too — that is the one that
            // matters, since the buffer can span posts and page loads.
            version: pageVersion(),
            annotations: list,
          },
          null,
          2
        );
      }

      function getToken() {
        var t;
        try {
          t = localStorage.getItem(TOKEN_KEY);
        } catch (e) {
          t = null;
        }
        if (t) return t;
        t = window.prompt(
          "GitHub personal access token with ONLY the `gist` scope.\n" +
            "Stored in this browser's localStorage — never committed."
        );
        if (!t) return null;
        t = t.trim();
        try {
          localStorage.setItem(TOKEN_KEY, t);
        } catch (e) {
          /* still usable for this one upload */
        }
        return t;
      }

      function uploadGist(list, note) {
        var token = getToken();
        if (!token) {
          note.textContent = "No token — cancelled.";
          return;
        }
        note.textContent = "Uploading…";

        var body = {
          // SECRET gist. `public: false` is the whole point — these are private
          // notes on unpublished thinking.
          public: false,
          // Larry greps for exactly this prefix. Do not reformat.
          description: "blog-review: " + PERMALINK,
          files: { "review.json": { content: payloadJson(list) } },
        };

        fetch("https://api.github.com/gists", {
          method: "POST",
          headers: {
            Accept: "application/vnd.github+json",
            Authorization: "Bearer " + token,
            "Content-Type": "application/json",
          },
          body: JSON.stringify(body),
        })
          .then(function (res) {
            if (res.status === 401 || res.status === 403) {
              try {
                localStorage.removeItem(TOKEN_KEY);
              } catch (e) {
                /* ignore */
              }
              throw new Error(
                "GitHub rejected the token (" +
                  res.status +
                  "). It has been cleared — retry to re-enter one with `gist` scope."
              );
            }
            if (!res.ok) throw new Error("GitHub returned " + res.status);
            return res.json();
          })
          .then(function (gist) {
            saveBuffer([]);
            refreshPill();
            note.innerHTML =
              "Uploaded ✅ <a href='" +
              escapeHtml(gist.html_url) +
              "' target='_blank' rel='noopener'>" +
              escapeHtml(gist.html_url) +
              "</a><br>Local buffer cleared.";
          })
          .catch(function (err) {
            // Never clear the buffer on failure — the notes are the valuable part.
            note.textContent = "Upload failed: " + err.message;
          });
      }
    }
  })();
</script>
