# CI-specific Jekyll configuration
# This file is merged with _config.yml when building in CI

# Exclude vendor directory (where bundler installs gems in CI)
exclude:
  - vendor/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - package.json
  - package-lock.json
  - README.md
  - .git/
  - .github/
  # Agent skill files (raw-fetched from GitHub, not site pages). Listed here
  # too because this exclude list REPLACES the one in _config.yml in CI.
  - skill/
