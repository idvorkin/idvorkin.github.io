# Local search (Pagefind). Replaced Algolia — see docs/search.md.
#
# Only pages carrying `data-pagefind-body` are indexed, and that attribute is
# emitted by _includes/pagefind-attrs.html. Most of the old Algolia
# `files_to_exclude` list is therefore obsolete: non-content pages (tags.html,
# all.md, scripts/*, tests/*) never get the attribute in the first place.
#
# What remains here is the set of real *content* pages to keep out of search.
# The family journal is excluded by collection/tag in pagefind-attrs.html, not
# by permalink, so it stays out even if a permalink changes.
search:
  exclude_permalinks:
    - /changelog
    - /positive-mitzvahs
    - /negative-mitzvahs

# Pagefind's index lives in ./pagefind/ (gitignored) so Jekyll treats it as a
# normal static directory and re-copies it into _site/ on every build. Without
# that, `jekyll serve --incremental` deletes it on every content edit, silently
# degrading search to title-only during local dev. keep_files covers the plain
# `jekyll build` case. See `just build-search`.
keep_files: [".git", ".svn", "pagefind"]

# plugins_dir: _plugins (default)
include: [".htaccess", "__init__.py"]
exclude:
  [
    "scripts/*",
    "gutter",
    ".parcel-cache",
    ".specstory",
    "lib",
    "config.rb",
    "Gemfile",
    "Capfile",
    "Gemfile.lock",
    "config",
    "log",
    "Rakefile",
    "Rakefile.rb",
    "tmp",
    "less",
    "*.sublime-project",
    "*.sublime-workspace",
    "test",
    "spec",
    "Gruntfile.js",
    "package.json",
    "cypress",
    "node_modules",
    "xnotes",
    ".cursor",
    "cursor-logs",
    "chop-logs",
    "zz-chop-logs",
    ".aider.tags.cache.v3",
    ".husky",
    ".vscode",
    "blog.chroma.db",
    "devdocker",
    "docs",
    "tech_graveyard",
    "test-results",
    "playwright-report",
    "tests",
    "src/__tests__",
    "repo_tmp",
    ".beads",
    ".claude",
    ".uv-cache",
    ".playwright-cli",
    "__pycache__",
  ]

permalink: /:title
siteurl: "https://idvork.in/"

plugins:
  - jekyll-redirect-from
  - jekyll-paginate
# Allow multiple permalinks for the same post
# https://help.github.com/articles/redirects-on-github-pages/
